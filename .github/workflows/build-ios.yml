name: Build iOS archives (unsigned verification)

# This is a VERIFICATION workflow, not a release: it holds zero signing
# secrets and publishes nothing. See doc/releases/RELEASE-IOS.md for how the
# admin actually ships a build (from their laptop, manually, per D-01 — the
# same model that replaced release-android.yml with build-android.yml).
#
# The macOS job below produces a deliberately UNSIGNED archive
# (CODE_SIGN_IDENTITY="", CODE_SIGNING_REQUIRED=NO, CODE_SIGNING_ALLOWED=NO,
# together). That is not an oversight to "fix" — an unsigned archive is not
# installable, and that is exactly what keeps "CI cannot publish" true (D-02).
#
# Why this file carries a `paths-ignore` when neither build-android.yml nor
# dashboard.yml has one: dashboard.yml's own `on:` block explains that a path
# filter was *considered and declined* there — "skip semantics are one more
# place a verdict can be misread ('no run' silently read as 'passed')" — and
# names its own reopen condition: "if runner-minute cost becomes the dominant
# complaint." This workflow's macOS runner is billed at roughly 10x a Linux
# runner, which meets that stated condition, so the filter below is justified
# on dashboard.yml's own terms — NOT as "matching Android's exception".
# Neither existing workflow has a docs exception; do not describe this as
# parity with build-android.yml.
#
# Consequence worth naming plainly: because `ruby-gates` (below) lives in
# this same file, it inherits this narrower trigger too — it runs on PRs to
# master and on manual dispatch, but NOT on a direct push to master. That is
# an accepted narrowing, not an oversight. Follow-up, out of scope for this
# plan: moving `ruby-gates` into dashboard.yml would give it push coverage on
# a cheap Linux runner, at zero macOS cost — dashboard.yml runs on push too
# and dashboard.yml is outside this file's scope.
#
# Operational note for the admin: while this workflow's pull_request trigger
# carries a paths-ignore, do NOT configure `ruby-gates` or `archive` as a
# *required* status check in branch protection unless the required-check
# targets are set up to tolerate a skipped run — a filtered-out workflow run
# never reports a status at all, and a required check that never reports
# blocks merges rather than passing them.
#
# Only the plain `pull_request` event below is used. Its target-scoped
# sibling event (the one whose name appends "_target") is intentionally
# absent and must stay absent: that event runs with a write-scoped token
# against the base repo's secrets while checking out the PR head's untrusted
# code, which would let a fork-submitted PR execute arbitrary code with
# elevated permissions. `pull_request` checks out and runs with the fork's
# own limited, read-only token instead. (Same reasoning as dashboard.yml.)
#
# This workflow has never been exercised by a real GitHub Actions run. The
# first real run after merge is its actual proof.

on:
  pull_request:
    branches: [master]
    paths-ignore:
      # scripts/** is deliberately ABSENT from this list, on purpose, and
      # must stay absent: it is exactly what the ruby-gates job below
      # guards, and a change there must never be able to skip these gates.
      # This list must also never grow to cover apps/**/project.pbxproj or
      # apps/VoteTorrentAuthority/src/** — those are what vt_team_gate and
      # vt_appattest_release_gate read. Checked and encoded as an executable
      # assertion in 55-05-PLAN.md task 1 (the "guarded paths" check).
      - 'doc/**'
      - '**/*.md'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1 -- ruby-gates: runs the fastlane Minitest files that, before this
  # workflow existed, nothing in the repo ever ran (no CI job, no
  # package.json script, no Rakefile). Also runs vt_team_gate as a CI lint.
  # ===========================================================================
  ruby-gates:
    name: "Ruby fastlane gates (Linux, no Xcode, no gems)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The runner's preinstalled Ruby is used directly: no ruby/setup-ruby,
      # no bundle install, no gem install. Both test files below need only
      # the Ruby stdlib plus the inline FastlaneCore::UI double they each
      # define themselves.
      - name: Ruby version receipt
        run: ruby --version

      # Deliberately one `ruby` process PER FILE, not a single process that
      # requires them all. vt_team_gate_test.rb and
      # vt_appattest_release_gate_test.rb each define their own top-level
      # REPO_ROOT, GENERATED_RELATIVE and FastlaneCore::UI double -- loading
      # both into one process collides. A collision that still exits 0 would
      # be the same "no run misread as passed" failure the paths-ignore
      # comment above warns about, so each file gets its own process and its
      # own exit code.
      - name: Run every fastlane gate test (one process per file)
        run: |
          set -euo pipefail
          files=(scripts/fastlane/*_test.rb)
          if [ "${#files[@]}" -lt 2 ]; then
            echo "::error::Expected at least 2 scripts/fastlane/*_test.rb files, found ${#files[@]}. A rename or moved directory must fail this job, not pass it silently."
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Running $f"
            ruby "$f" || exit 1
          done

      # D-09's gate as a CI lint (55-03 decided this job should run it here).
      # fastlane is deliberately not installed; this is the same inline
      # FastlaneCore::UI double shape 55-03 proved in vt_team_gate_test.rb.
      # This is a lint in this job, while remaining a hard gate in the real
      # release lanes (the Voter's iOS beta/release Fastfile).
      - name: Team consistency gate against the real checkout
        run: |
          set -euo pipefail
          ruby -e '
            module FastlaneCore
              module UI
                class Error < StandardError; end
                class << self
                  def user_error!(msg)
                    raise Error, msg
                  end
                  def success(msg)
                    puts msg
                  end
                end
              end
            end
            require "./scripts/fastlane/vt_team_gate"
            VtTeamGate.assert_team!(Dir.pwd)
          '
