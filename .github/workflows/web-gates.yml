name: Web gates

# This workflow wires `packages/ui-web`'s own suite and both consuming web
# apps' (the dashboard and the public no-login election view) already-built
# test tiers into a permanent CI gate. A reader coming to this file cold needs
# five things this file cannot say anywhere else:
#
# (a) What each tier can and cannot prove. Tier 1 (job `logic-gate`) is a fast
#     browser-free suite over pure logic modules -- it proves NOTHING about
#     persistence, quota, eviction, cross-tab locking, or structured-clone
#     edges, and it CANNOT catch a missing `setDefaultVtabName`: every
#     in-session assertion passes while nothing was actually written to
#     IndexedDB. That is exactly why job `logic-gate`'s name says so
#     explicitly, and why tiers 2 and 3 exist as a separate, independent job
#     against real headless Chrome. Tier 1 also runs the three-root copy-
#     discipline lint (D-06), the repo-root `@votetorrent/ui-web` dedupe/gate
#     consumer assertion (D-21), the `@votetorrent/ui-web` package's own
#     typecheck and tier-1 suite, and the public election view's typecheck,
#     tier-1 suite, build, polyfill-purity check, gate build and
#     harness-in-dist scan.
# (b) The FOUR `--prove-*` modes this workflow runs (`--prove-trap` for tier
#     2, `--prove-drift` for tier 3, and the shared browser-gate runner's own
#     `--prove-no-dedupe` / `--prove-token-missing`) are INERTNESS CONTROLS,
#     not extra gates. Each one runs the real gate against a deliberately
#     broken fixture, and INVERTS the expectation: exit 0 means the inner run
#     genuinely FAILED. A green workflow run in which any control did NOT fire
#     is a broken gate masquerading as a pass, not a real pass -- this file
#     greps each control's OWN log for the literal substring "is inert" and
#     fails the job when it is PRESENT, because that sentinel is printed by
#     the runner precisely when the inner run it was supposed to invert still
#     passed. The two shared-runner controls rebuild a genuinely mutated
#     production (or gate) variant at BUILD time -- never `dist/` edited after
#     the fact, never anything mutated at runtime -- because spike 089
#     measured a runtime React-identity check as false-negative.
# (c) The three measured baselines this phase closes, and which one this
#     workflow enforces. `packages/vote-engine` is enforced exactly (9 known
#     failures, verbatim titles) because this phase edited that package
#     twice. `apps/VoteTorrentAuthority`'s typecheck is enforced as a ceiling
#     because this phase added files there. `apps/VoteTorrentVoter`'s jest
#     suite (4 failing on uint8arrays) is recorded in scripts/ci-baselines.json
#     and echoed to every `baselines` job run, but deliberately NOT run here:
#     this phase touches nothing in the voter, and importing an unrelated red
#     baseline into a gate whose entire value is trustworthiness would make
#     the gate less useful, not more. This workflow's tier-1 job enforces
#     THREE separate tier-1 baselines -- `dashboardTier1`, `uiWebTier1` and
#     `publicTier1` -- each with its own receipt marker (`tier1-logic`,
#     `tier1-ui-web`, `tier1-public`) so three tier-1 suites can never satisfy
#     one receipt requirement between them.
# (d) This workflow reads NO repository secret and publishes nothing. Every
#     step is either a local command or a diagnostic-only upload gated on
#     failure.
# (e) Why the browser job covers two apps with duplicated steps instead of a
#     job-level build matrix. Job `browser-gates`'s `name:` is the branch-
#     protection required check's join key, and a matrixed job's rendered
#     check-run name is NOT its static `name:` string -- the matrix values are
#     appended to it, so a required check keyed on the undecorated string
#     would silently stop reporting the moment a matrix were introduced.
#     Duplicated, individually named steps inside the one job satisfy "run the
#     shared runner over both consumers" with none of that risk.

on:
  push:
  pull_request:
  workflow_dispatch:
  # No `paths` / `paths-ignore` filter: the gates always run on every push and
  # pull request. A path filter was considered and declined -- skip semantics
  # are one more place a verdict can be misread ("no run" silently read as
  # "passed"), and this workflow is fast enough that the runner-minute cost of
  # always running it is the right trade. Reopen this only if runner-minute
  # cost becomes the dominant complaint.
  #
  # Only the plain `pull_request` event above is used. Its target-scoped
  # sibling event (the one whose name appends "_target") is intentionally
  # absent and must stay absent: that event runs with a write-scoped token
  # against the base repo's secrets while checking out the PR head's
  # untrusted code, which would let a fork-submitted PR execute arbitrary
  # code with elevated permissions. `pull_request` checks out and runs with
  # the fork's own limited, read-only token instead.

permissions:
  contents: read

concurrency:
  group: web-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Job 1 -- Tier 1: fast, browser-free logic gate.
  # =========================================================================
  logic-gate:
    name: "Tier 1 - logic gate (no browser, proves nothing about persistence)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # setup-node's built-in dependency-cache option is intentionally
          # left unset: pointing it at yarn shells out to the runner's global
          # Yarn 1.22.22, which hard-errors against this repo's
          # `packageManager: yarn@4.7.0` pin. Yarn's own global cache is
          # restored via actions/cache below instead.
          #
          # node-version floats at '22' rather than being pinned tighter,
          # mirroring build-android.yml. This is safe here specifically
          # because every tier-1-reachable dashboard module is ESM `.js` with
          # JSDoc types under `checkJs`, not `.ts` -- so there is no
          # type-stripping behavior (flagged on Node 22.15 locally, unflagged
          # on CI's 22.18) for a floating minor version to diverge on. Pinning
          # tighter than the local dev machine would recreate exactly the
          # divergence that module-format contract exists to prevent.

      # Corepack MUST be enabled before anything invokes `yarn` -- see the
      # comment on setup-node above; this mirrors build-android.yml verbatim.
      - name: Enable Corepack (pinned Yarn 4.7.0)
        run: |
          set -euo pipefail
          corepack enable
          echo "RECEIPT toolchain node=$(node --version) yarn=$(yarn --version)" | tee -a ci-receipt.txt

      - name: Cache Yarn global cache
        uses: actions/cache@v4
        with:
          # .yarnrc.yml sets enableGlobalCache: true, so downloads land in the
          # global folder rather than a per-project .yarn/cache.
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install workspace dependencies
        run: |
          set -euo pipefail
          yarn install --immutable

      # Workspace packages publish their entrypoints from dist/ (e.g.
      # @votetorrent/vote-engine exports ./browser -> ./dist/browser-entry.js),
      # and dist/ is gitignored. A clean CI checkout therefore has no dist/,
      # and the dashboard's typecheck/build would fail to resolve
      # @votetorrent/vote-engine/browser without this step. Scoped to
      # packages/* on purpose -- apps/* must NOT be built here. packages/ui-web
      # declares no `build` script of its own (53-02 publishes its source
      # directly, no bundling step) -- `yarn workspaces foreach` silently
      # skips a workspace with no matching script, so its presence under
      # packages/* does not make this step fail.
      - name: Build workspace packages
        run: |
          set -euo pipefail
          yarn workspaces foreach -At --include 'packages/*' run build

      # Widening KNOWN_ALLOWED in scripts/check-peer-requirements.mjs to make
      # this pass is FORBIDDEN. This step exiting 0 is an honest acceptance
      # criterion -- it is the only signal left after .yarnrc.yml's
      # project-wide YN0086 discard silences the raw install-time summary. If
      # this fires on a real change, that is the finding, not a false alarm
      # to work around.
      - name: Peer requirements
        run: |
          set -euo pipefail
          yarn lint:peers
          echo "RECEIPT peers-clean" | tee -a ci-receipt.txt

      - name: Typecheck
        run: |
          set -euo pipefail
          yarn workspace votetorrent-dashboard typecheck
          echo "RECEIPT dashboard-typecheck" | tee -a ci-receipt.txt

      # The dashboard's own `lint` script (53-10) is now a DELEGATION to this
      # identical repo-root script, so this step and `yarn workspace
      # votetorrent-dashboard lint` produce byte-identical output regardless
      # of launch directory -- running both here would scan all three roots
      # twice and invite the false belief that each workspace lints only
      # itself. This step covers all three: packages/ui-web/src,
      # apps/VoteTorrentDashboard/src and apps/VoteTorrentPublic/src (D-06).
      - name: Copy discipline (three roots)
        run: |
          set -euo pipefail
          yarn lint:copy
          echo "RECEIPT copy-lint-3root" | tee -a ci-receipt.txt

      - name: ui-web typecheck
        run: |
          set -euo pipefail
          yarn workspace @votetorrent/ui-web typecheck
          echo "RECEIPT ui-web-typecheck" | tee -a ci-receipt.txt

      # The D-21 static assertion: every workspace depending on
      # @votetorrent/ui-web must declare resolve.dedupe: ['react','react-dom']
      # in its production Vite config AND a script reaching the one shared
      # browser-gate runner. It runs before any app build in this job by
      # design -- no browser, no network, no `yarn` invocation of its own --
      # so a fourth consumer that forgets either requirement is caught here,
      # structurally, before the behavioural gates below ever run.
      - name: ui-web consumers (D-21 dedupe/gate assertion)
        run: |
          set -euo pipefail
          yarn assert:ui-web-consumers
          echo "RECEIPT ui-web-consumers" | tee -a ci-receipt.txt

      # Resolves 53-12's own open question: without this step,
      # @votetorrent/ui-web's own tier-1 suite (package-shape.test.mjs's
      # three-way exports split, the ERR_MODULE_NOT_FOUND proof, and the
      # absent-from-root-package.json React assertion) never runs in CI, and
      # 53-12's root-hoist rung would be the ONLY CI-reachable coverage of the
      # never-hoist-React rule. It does now.
      - name: Tier 1 - ui-web package suite
        run: |
          set -euo pipefail
          T1_START=$SECONDS
          yarn workspace @votetorrent/ui-web test 2>&1 | tee ui-web-tier1.log
          T1_ELAPSED=$((SECONDS-T1_START))
          node scripts/assert-ci-baselines.mjs tier1 ui-web-tier1.log "$T1_ELAPSED" --baseline uiWebTier1 | tee -a ci-receipt.txt

      - name: Public app typecheck
        run: |
          set -euo pipefail
          yarn workspace votetorrent-public typecheck
          echo "RECEIPT public-typecheck" | tee -a ci-receipt.txt

      - name: Tier 1 - public app logic suite
        run: |
          set -euo pipefail
          T1_START=$SECONDS
          yarn workspace votetorrent-public test:node 2>&1 | tee public-tier1.log
          T1_ELAPSED=$((SECONDS-T1_START))
          node scripts/assert-ci-baselines.mjs tier1 public-tier1.log "$T1_ELAPSED" --baseline publicTier1 | tee -a ci-receipt.txt

      - name: Public app build and polyfill assertion
        run: |
          set -euo pipefail
          yarn workspace votetorrent-public build
          yarn workspace votetorrent-public assert:no-polyfills
          echo "RECEIPT public-build-no-polyfills" | tee -a ci-receipt.txt

      # The gate build (dist-gate/) is required here because 53-09's
      # harness-in-dist scan uses dist-gate/ as its cross-build PRESENCE
      # control: without a gate build to scan, a zero-hit result against
      # dist/ would be indistinguishable from a matcher that is simply blind.
      - name: Public app gate build and harness-in-dist scan
        run: |
          set -euo pipefail
          yarn workspace votetorrent-public build:gate
          yarn workspace votetorrent-public assert:no-test-harness-in-dist
          echo "RECEIPT public-no-harness-in-dist" | tee -a ci-receipt.txt

      - name: Build and polyfill assertion
        run: |
          set -euo pipefail
          yarn workspace votetorrent-dashboard build
          yarn workspace votetorrent-dashboard assert:no-polyfills
          echo "RECEIPT dashboard-build-no-polyfills" | tee -a ci-receipt.txt

      # This assertion exists on disk at HEAD and CI has never run it; 53-08
      # extended it with the `ui-gate` and `__UI_GATE__` tokens, so it now
      # guards the new shared-runner harness too.
      - name: Dashboard harness-in-dist scan
        run: |
          set -euo pipefail
          yarn workspace votetorrent-dashboard assert:no-test-harness-in-dist
          echo "RECEIPT dashboard-no-harness-in-dist" | tee -a ci-receipt.txt

      # The tier-1 test runner's own exit code IS trustworthy here (unlike
      # vote-engine's and the authority typecheck's, both of which carry known
      # pre-existing non-zero exits) -- but the checker, not the exit code
      # alone, is still the verdict, because it also enforces the passing
      # floor and the time budget and prints the RECEIPT line.
      - name: Tier 1 - dashboard logic suite
        run: |
          set -euo pipefail
          T1_START=$SECONDS
          yarn workspace votetorrent-dashboard test:node 2>&1 | tee tier1.log
          T1_ELAPSED=$((SECONDS-T1_START))
          node scripts/assert-ci-baselines.mjs tier1 tier1.log "$T1_ELAPSED" | tee -a ci-receipt.txt

      - name: Receipts
        run: |
          set -euo pipefail
          node scripts/assert-ci-baselines.mjs receipts ci-receipt.txt \
            toolchain peers-clean dashboard-typecheck copy-lint-3root \
            dashboard-build-no-polyfills dashboard-no-harness-in-dist \
            ui-web-typecheck ui-web-consumers tier1-ui-web \
            public-typecheck tier1-public public-build-no-polyfills \
            public-no-harness-in-dist tier1-logic

  # =========================================================================
  # Job 2 -- Tiers 2 and 3: headless Chrome, persistence then model vs DOM.
  # No `needs:` -- independent of logic-gate, so a tier-2/3 failure is visible
  # even when tier 1 is red, and each job's verdict stands on its own.
  # =========================================================================
  browser-gates:
    name: "Tiers 2 and 3 - headless Chrome (persistence, then model vs DOM)"
    runs-on: ubuntu-24.04
    # Raised from 30 (53-13): this job now performs two additional production
    # builds, two gate builds and four mutated production/gate rebuilds on top
    # of the four legacy dashboard-only legs. The bound exists to catch a
    # hang, not to be a target -- if a real run approaches it, that is a
    # finding about the gate's cost, not a number to raise again.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (pinned Yarn 4.7.0)
        run: |
          set -euo pipefail
          corepack enable
          echo "RECEIPT toolchain node=$(node --version) yarn=$(yarn --version)" | tee -a ci-receipt.txt

      - name: Cache Yarn global cache
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install workspace dependencies
        run: |
          set -euo pipefail
          yarn install --immutable

      - name: Build workspace packages
        run: |
          set -euo pipefail
          yarn workspaces foreach -At --include 'packages/*' run build

      # This step runs FIRST, before anything else in this job, on purpose: a
      # stripped inertness control would otherwise be invisible behind four
      # green gate runs. It asserts the gate's own source still carries every
      # invariant this workflow depends on. Generalised (53-13) to guard BOTH
      # runners this job now invokes -- the legacy dashboard-only
      # run-headless.mjs, unchanged below, and the shared
      # packages/ui-web/scripts/run-ui-gates.mjs, added below it.
      - name: Gate-source integrity
        run: |
          set -euo pipefail
          G=apps/VoteTorrentDashboard/test/browser/run-headless.mjs
          fail=0
          for banned in playwright-core executablePath 'Applications/Google Chrome' 'reload()'; do
            if grep -q -- "$banned" "$G"; then
              echo "::error::gate-source-intact: forbidden pattern '$banned' found in $G"
              fail=1
            fi
          done
          # grep -c exits non-zero when the count is zero; a zero here IS the
          # failure condition we want to report (not crash past), so the
          # count is read inside a subshell with errexit disabled rather than
          # relying on an unconditional fallback (reserved solely for the
          # browser inventory probe below).
          newpage_count=$(set +e; grep -c 'newPage()' "$G"; true)
          if [ "$newpage_count" -lt 9 ]; then
            echo "::error::gate-source-intact: expected at least 9 newPage() calls (50-14's eight fresh loads, six from 50-09 plus the composed-shell leg, plus 50-18's compose-swap leg), found $newpage_count"
            fail=1
          fi
          for required in prove-trap prove-drift tier3 prove-blank prove-conflated; do
            if ! grep -q -- "$required" "$G"; then
              echo "::error::gate-source-intact: expected mode '$required' not found in $G"
              fail=1
            fi
          done
          # Comment-filtered, not bare: a bare `grep -c` counts this file's own
          # header prose ("is inert" appears in three explanatory sentences
          # before it ever appears in a real emission site), so a floor of 3
          # was satisfiable by comments alone -- a self-invalidating gate.
          # Measured at HEAD: bare 9, comment-filtered 4 (the four real
          # emission sites: --prove-drift, --prove-blank, --prove-conflated,
          # --prove-trap). `prove-conflated` is asserted above as a required
          # mode but this job runs no step invoking it -- carried forward as
          # this plan's one recorded finding for the phase-close review.
          inert_count=$(set +e; grep -n 'is inert' "$G" | grep -vE ':[[:space:]]*(\*|//|/\*)' | wc -l; true)
          if [ "$inert_count" -lt 4 ]; then
            echo "::error::gate-source-intact: expected at least 4 comment-filtered occurrences of 'is inert' in $G (the four real emission sites), found $inert_count"
            fail=1
          fi

          # Second block: the shared browser-gate runner both apps invoke.
          # Both blocks always run regardless of the first block's outcome --
          # one combined fail flag, checked once at the very end -- so a
          # planted violation in either file is reported in the same run,
          # never masked by the other file's own failure.
          U=packages/ui-web/scripts/run-ui-gates.mjs
          if [ ! -f "$U" ]; then
            echo "::error::gate-source-intact: $U does not exist"
            fail=1
          fi
          # startViteDevServer / executablePath / channel: 'chrome' have no
          # legitimate reason to appear in this file at all, in code OR
          # comment -- zero occurrences is the bar. The dev-server ban is the
          # load-bearing one: `vite dev` is proven blind to all four package
          # shapes this phase built, and a runner that quietly acquired a
          # dev-server transport would report green on a build that cannot
          # ship.
          for banned in startViteDevServer executablePath "channel: 'chrome'"; do
            if grep -q -- "$banned" "$U"; then
              echo "::error::gate-source-intact: forbidden pattern '$banned' found in $U"
              fail=1
            fi
          done
          # `vite dev` legitimately appears in this file's OWN prose
          # explaining why it is disqualified as a transport -- comment-
          # filtered so that explanatory prose cannot itself trip the ban,
          # while a real dev-server invocation (never inside a comment)
          # still would.
          vitedev_count=$(set +e; grep -n 'vite dev' "$U" | grep -vE ':[[:space:]]*(\*|//|/\*)' | wc -l; true)
          if [ "$vitedev_count" -gt 0 ]; then
            echo "::error::gate-source-intact: 'vite dev' found outside a comment in $U -- a dev-server transport must never be reachable code"
            fail=1
          fi
          # `playwright-core` legitimately appears once, as a plain path
          # string resolving the installed version for the Chromium receipt
          # line -- never as an import/require specifier that would let this
          # file launch a browser through playwright-core directly, bypassing
          # the declared `playwright` dependency this job installs.
          if grep -qE "(from|require\()[[:space:]]*['\"]playwright-core['\"]" "$U"; then
            echo "::error::gate-source-intact: $U imports playwright-core directly -- forbidden transport"
            fail=1
          fi
          for required in prove-no-dedupe prove-token-missing; do
            if ! grep -q -- "$required" "$U"; then
              echo "::error::gate-source-intact: expected mode '$required' not found in $U"
              fail=1
            fi
          done
          # Measured at HEAD: comment-filtered 3 (the generic finishRun
          # branch, unused by either control, plus one dedicated line per
          # control) -- see 53-11-SUMMARY.md's own recorded filter/count.
          u_inert_count=$(set +e; grep -n 'is inert' "$U" | grep -vE ':[[:space:]]*(\*|//|/\*)' | wc -l; true)
          if [ "$u_inert_count" -lt 3 ]; then
            echo "::error::gate-source-intact: expected at least 3 comment-filtered occurrences of 'is inert' in $U, found $u_inert_count"
            fail=1
          fi
          # 53-12's canonical-runner invariant, restated where CI can see it:
          # a forked second copy of this runner is how one app ends up gated
          # by a runner nobody is maintaining.
          runner_count=$(find . -name 'run-ui-gates.mjs' -not -path '*/node_modules/*' | wc -l | tr -d ' ')
          if [ "$runner_count" != "1" ]; then
            echo "::error::gate-source-intact: expected exactly one run-ui-gates.mjs outside node_modules, found $runner_count"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error::gate-source-intact FAILED -- an inertness control, a banned transport, or the canonical-runner invariant may have been compromised"
            exit 1
          fi
          echo "RECEIPT gate-source-intact" | tee -a ci-receipt.txt

      # Record what the image already carries BEFORE installing anything --
      # this closes research assumption A4 ([ASSUMED — not verified against
      # the actual runner image]) with an observation instead of a guess.
      # This is the one place in this whole file where a command's failure is
      # unconditionally swallowed: it is a diagnostic probe, not a gate, and
      # its output is informational only.
      - name: Browser inventory (pre-install probe)
        run: |
          set -euo pipefail
          which -a google-chrome chromium chromium-browser || true

      # nmHoistingLimits: workspaces means no hoisted devDependency may be
      # assumed. Two declarations of `playwright` are installed below: the
      # dashboard workspace's own (for the legacy run-headless.mjs, driven via
      # its own `exec`), and packages/ui-web's own (53-08 declares it there so
      # ONE declaration serves both consuming apps' invocations of the shared
      # run-ui-gates.mjs -- Node resolves that script's own `import
      # 'playwright'` relative to the SCRIPT's location, not the invoking
      # app's cwd). Both are pinned at the same version, so the second
      # install is a same-version no-op against the shared
      # ~/.cache/ms-playwright browser cache; two DIFFERENT versions would
      # mean two browser downloads and two possible behaviours, and printing
      # both resolved versions into the receipt is where that skew becomes
      # visible instead of silent.
      #
      # The browser binary is DELIBERATELY NOT CACHED. A restored
      # ~/.cache/ms-playwright is a mutable trust surface inside the one gate
      # whose entire value is trustworthiness, and roughly a minute of
      # download is the right price for that. Reopen this only if the
      # download becomes the dominant cost, and then only with a cache key
      # that pins the resolved playwright version.
      - name: Install Chromium
        run: |
          set -euo pipefail
          yarn workspace votetorrent-dashboard exec playwright install --with-deps chromium
          DASH_PW_VERSION=$(yarn workspace votetorrent-dashboard exec playwright --version)
          yarn workspace @votetorrent/ui-web exec playwright install --with-deps chromium
          UI_WEB_PW_VERSION=$(yarn workspace @votetorrent/ui-web exec playwright --version)
          echo "RECEIPT chromium-installed dashboard-playwright=${DASH_PW_VERSION} ui-web-playwright=${UI_WEB_PW_VERSION} preexisting=see-browser-inventory-step-above" | tee -a ci-receipt.txt

      # Tier 2 runs before tier 3 on purpose: the first Vite boot warms
      # node_modules/.vite. The three later runner invocations (prove-trap,
      # tier3, prove-drift) each spawn their own dev server and would
      # otherwise each pay a cold optimizeDeps.
      # This step now runs the default eight page loads: 50-09's original six
      # (db-gate seed/verify, shell-gate restore-seed/restore-verify,
      # forget/forget-verify) plus 50-14's composed-shell leg
      # (compose-seed/compose-verify), which mounts the real, production
      # DashboardShell across a genuinely fresh page boundary and asserts the
      # nine-panel/real-badge readout -- the rung that would have caught
      # CR-01. Asserting on the compose readout's own PASS line (not merely
      # on the absence of "is inert") is deliberate: absence-of-a-string is
      # not evidence the composed leg ran at all.
      - name: Tier 2 - persistence (eight fresh page loads)
        working-directory: apps/VoteTorrentDashboard
        run: |
          set -euo pipefail
          node test/browser/run-headless.mjs 2>&1 | tee ../../tier2.log
          if grep -q 'is inert' ../../tier2.log; then
            echo "::error::tier2-persistence: 'is inert' appeared in a run that was not an inertness-control invocation"
            exit 1
          fi
          if ! grep -q 'compose-gate leg (composed DashboardShell, nine populated panels): PASS' ../../tier2.log; then
            echo "::error::tier2-persistence: the composed-shell leg's own PASS verdict line was not found in tier2.log"
            exit 1
          fi
          echo "RECEIPT tier2-persistence" | tee -a ../../ci-receipt.txt
          echo "RECEIPT compose-shell" | tee -a ../../ci-receipt.txt

      # Exit 0 here means the inner two-page run genuinely FAILED with
      # setDefaultVtabName deliberately omitted -- a guard that cannot fire is
      # not a guard, and this trap is invisible to every same-session
      # assertion tier 1 could ever run.
      - name: Tier 2 inertness control (--prove-trap)
        working-directory: apps/VoteTorrentDashboard
        run: |
          set -euo pipefail
          node test/browser/run-headless.mjs --prove-trap 2>&1 | tee ../../prove-trap.log
          if grep -q 'is inert' ../../prove-trap.log; then
            echo "::error::tier2-inertness-fired: --prove-trap reported 'is inert' -- the trap did NOT fire, the gate is inert"
            exit 1
          fi
          echo "RECEIPT tier2-inertness-fired" | tee -a ../../ci-receipt.txt

      # Exit 0 here means the composed-shell leg's own nine-panel assertion
      # genuinely FAILED for an officer the database grants nothing -- the
      # composed rung's own inertness control (50-14), receipted separately,
      # in the same shape as the two pre-existing controls above/below.
      - name: Composed shell inertness control (--prove-blank)
        working-directory: apps/VoteTorrentDashboard
        run: |
          set -euo pipefail
          node test/browser/run-headless.mjs --prove-blank 2>&1 | tee ../../prove-blank.log
          if grep -q 'is inert' ../../prove-blank.log; then
            echo "::error::compose-inertness-fired: --prove-blank reported 'is inert' -- an officer the database grants nothing still reported the full panel set, the composed rung is inert"
            exit 1
          fi
          echo "RECEIPT compose-inertness-fired" | tee -a ../../ci-receipt.txt

      - name: Tier 3 - model vs DOM cross-check
        working-directory: apps/VoteTorrentDashboard
        run: |
          set -euo pipefail
          node test/browser/run-headless.mjs --tier3 2>&1 | tee ../../tier3.log
          if ! grep -q '20/20' ../../tier3.log || ! grep -q '135/135' ../../tier3.log; then
            echo "::error::tier3-model-dom: expected stdout to contain 20/20 rungs and 135/135 headline comparisons"
            exit 1
          fi
          if grep -q 'is inert' ../../tier3.log; then
            echo "::error::tier3-model-dom: 'is inert' appeared in a run that was not an inertness-control invocation"
            exit 1
          fi
          echo "RECEIPT tier3-model-dom" | tee -a ../../ci-receipt.txt

      # Exit 0 here means the runner correctly detected a deliberately
      # mismatched scope set as a divergence.
      - name: Tier 3 inertness control (--prove-drift)
        working-directory: apps/VoteTorrentDashboard
        run: |
          set -euo pipefail
          node test/browser/run-headless.mjs --prove-drift 2>&1 | tee ../../prove-drift.log
          if grep -q 'is inert' ../../prove-drift.log; then
            echo "::error::tier3-inertness-fired: --prove-drift reported 'is inert' -- the drift was NOT detected, the cross-check is inert"
            exit 1
          fi
          echo "RECEIPT tier3-inertness-fired" | tee -a ../../ci-receipt.txt

      # The shared runner's own healthy-flow leg for the dashboard, run once
      # per consuming app (53-13, D-19/D-20/D-21). Never `vite dev`: the same
      # build+serveDist+chromium transport `main()` uses -- see Gate-source
      # integrity above. `RECEIPT ui-gates ...`'s own `rungs=`/`passed=` pair
      # is the positive verdict line asserted below -- absence-of-a-string
      # ("is inert" not present) is not evidence the leg ran at all; a
      # rungs==passed>=9 result is.
      - name: Dashboard shared-runner gate (gate:ui)
        working-directory: apps/VoteTorrentDashboard
        run: |
          set -euo pipefail
          yarn gate:ui 2>&1 | tee ../../ui-gate-dashboard.log
          if grep -q 'is inert' ../../ui-gate-dashboard.log; then
            echo "::error::ui-gate-dashboard: 'is inert' appeared in a run that was not an inertness-control invocation"
            exit 1
          fi
          line=$(grep -oE 'RECEIPT ui-gates app=[^ ]+ rungs=[0-9]+ passed=[0-9]+' ../../ui-gate-dashboard.log | tail -1)
          if [ -z "$line" ]; then
            echo "::error::ui-gate-dashboard: no RECEIPT ui-gates summary line found -- cannot confirm the leg ran at all"
            exit 1
          fi
          rungs=$(echo "$line" | grep -oE 'rungs=[0-9]+' | cut -d= -f2)
          passed=$(echo "$line" | grep -oE 'passed=[0-9]+' | cut -d= -f2)
          if [ "$rungs" != "$passed" ] || [ "$rungs" -lt 9 ]; then
            echo "::error::ui-gate-dashboard: rungs=$rungs passed=$passed -- expected passed==rungs and rungs>=9"
            exit 1
          fi
          grep -q 'gate-config=' ../../ui-gate-dashboard.log && grep -q 'gate-dist=' ../../ui-gate-dashboard.log && grep -q 'gate-entry=' ../../ui-gate-dashboard.log && grep -q 'port=5183' ../../ui-gate-dashboard.log
          echo "RECEIPT ui-gate-dashboard" | tee -a ../../ci-receipt.txt

      # The public app's SECOND invocation of the identical runner, against
      # its own gate build (dist-gate/, port 5191) -- proving the shared
      # runner over both consumers with none of a build matrix's risk to the
      # job's own required-check name (see header (e)).
      - name: Public app shared-runner gate (test:browser)
        working-directory: apps/VoteTorrentPublic
        run: |
          set -euo pipefail
          # test:browser bakes in --gate-config/--gate-dist/--gate-entry/--port
          # and builds internally (no --skip-build) -- a separate `build:gate`
          # here would only rebuild the same output a second time.
          yarn test:browser 2>&1 | tee ../../ui-gate-public.log
          if grep -q 'is inert' ../../ui-gate-public.log; then
            echo "::error::ui-gate-public: 'is inert' appeared in a run that was not an inertness-control invocation"
            exit 1
          fi
          line=$(grep -oE 'RECEIPT ui-gates app=[^ ]+ rungs=[0-9]+ passed=[0-9]+' ../../ui-gate-public.log | tail -1)
          if [ -z "$line" ]; then
            echo "::error::ui-gate-public: no RECEIPT ui-gates summary line found -- cannot confirm the leg ran at all"
            exit 1
          fi
          rungs=$(echo "$line" | grep -oE 'rungs=[0-9]+' | cut -d= -f2)
          passed=$(echo "$line" | grep -oE 'passed=[0-9]+' | cut -d= -f2)
          if [ "$rungs" != "$passed" ] || [ "$rungs" -lt 9 ]; then
            echo "::error::ui-gate-public: rungs=$rungs passed=$passed -- expected passed==rungs and rungs>=9"
            exit 1
          fi
          # A public leg that silently ran on the dashboard's defaults would
          # emit no config line at all -- this app's own `test:browser` script
          # already bakes in its four non-default flags, so nothing here
          # duplicates them; the banner is only asserted.
          grep -q 'gate-config=vite.gate.config.ts' ../../ui-gate-public.log
          grep -q 'gate-dist=dist-gate' ../../ui-gate-public.log
          grep -q 'gate-entry=election-shell-gate.html' ../../ui-gate-public.log
          grep -q 'port=5191' ../../ui-gate-public.log
          echo "RECEIPT ui-gate-public" | tee -a ../../ci-receipt.txt

      # Four D-20 negative controls, one per control per app. Each rebuilds a
      # genuinely mutated production (dedupe) or gate (token) build at BUILD
      # TIME -- never `dist/` edited after the fact, never anything mutated
      # at runtime -- and each INVERTS the expectation: exit 0 means the
      # inner run genuinely failed in the measured shape. 5181 is both
      # run-headless.mjs's dev-server port and the public app's dev/preview
      # port; the workflow never starts the public app's dev or preview
      # server (`vite dev` is never a gate) and every step here is
      # sequential, so the two can never bind concurrently -- a future editor
      # who adds a preview server should read this sentence before doing so.
      #
      # Dedupe control, exit 0 means: a rebuild with `resolve.dedupe` removed
      # genuinely failed the five `identity:` rungs in the measured PARTIAL
      # shape (both D-23 token rungs still passing) -- a duplicate React
      # reaching the hook dispatcher, not a crashed page.
      - name: Dashboard dedupe inertness control (--prove-no-dedupe)
        working-directory: apps/VoteTorrentDashboard
        run: |
          set -euo pipefail
          yarn gate:prove-no-dedupe 2>&1 | tee ../../ui-gate-dashboard-prove-no-dedupe.log
          if grep -q 'is inert' ../../ui-gate-dashboard-prove-no-dedupe.log; then
            echo "::error::ui-gate-dashboard-dedupe-control-fired: --prove-no-dedupe reported 'is inert' -- the mutated build still passed every rung, the dedupe control did NOT fire"
            exit 1
          fi
          echo "RECEIPT ui-gate-dashboard-dedupe-control-fired" | tee -a ../../ci-receipt.txt

      # Token control, exit 0 means: a rebuild with the shared tokens
      # stylesheet's reference removed genuinely failed the two D-23 token
      # rungs while all five identity rungs still passed -- a resolved
      # computed CSS custom-property value going missing, not a crashed page.
      - name: Dashboard token inertness control (--prove-token-missing)
        working-directory: apps/VoteTorrentDashboard
        run: |
          set -euo pipefail
          yarn gate:prove-token-missing 2>&1 | tee ../../ui-gate-dashboard-prove-token-missing.log
          if grep -q 'is inert' ../../ui-gate-dashboard-prove-token-missing.log; then
            echo "::error::ui-gate-dashboard-token-control-fired: --prove-token-missing reported 'is inert' -- the mutated build still passed every rung, the token control did NOT fire"
            exit 1
          fi
          echo "RECEIPT ui-gate-dashboard-token-control-fired" | tee -a ../../ci-receipt.txt

      - name: Public app dedupe inertness control (--prove-no-dedupe)
        working-directory: apps/VoteTorrentPublic
        run: |
          set -euo pipefail
          yarn gate:prove-no-dedupe 2>&1 | tee ../../ui-gate-public-prove-no-dedupe.log
          if grep -q 'is inert' ../../ui-gate-public-prove-no-dedupe.log; then
            echo "::error::ui-gate-public-dedupe-control-fired: --prove-no-dedupe reported 'is inert' -- the mutated build still passed every rung, the dedupe control did NOT fire"
            exit 1
          fi
          echo "RECEIPT ui-gate-public-dedupe-control-fired" | tee -a ../../ci-receipt.txt

      - name: Public app token inertness control (--prove-token-missing)
        working-directory: apps/VoteTorrentPublic
        run: |
          set -euo pipefail
          yarn gate:prove-token-missing 2>&1 | tee ../../ui-gate-public-prove-token-missing.log
          if grep -q 'is inert' ../../ui-gate-public-prove-token-missing.log; then
            echo "::error::ui-gate-public-token-control-fired: --prove-token-missing reported 'is inert' -- the mutated build still passed every rung, the token control did NOT fire"
            exit 1
          fi
          echo "RECEIPT ui-gate-public-token-control-fired" | tee -a ../../ci-receipt.txt

      - name: Upload gate evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-gate-evidence-${{ github.sha }}
          path: |
            tier2.log
            prove-trap.log
            prove-blank.log
            tier3.log
            prove-drift.log
            ui-gate-dashboard.log
            ui-gate-public.log
            ui-gate-dashboard-prove-no-dedupe.log
            ui-gate-dashboard-prove-token-missing.log
            ui-gate-public-prove-no-dedupe.log
            ui-gate-public-prove-token-missing.log
            ci-receipt.txt
          retention-days: 14

      - name: Receipts
        run: |
          set -euo pipefail
          node scripts/assert-ci-baselines.mjs receipts ci-receipt.txt \
            toolchain gate-source-intact chromium-installed tier2-persistence \
            tier2-inertness-fired compose-shell compose-inertness-fired \
            tier3-model-dom tier3-inertness-fired \
            ui-gate-dashboard ui-gate-public \
            ui-gate-dashboard-dedupe-control-fired ui-gate-dashboard-token-control-fired \
            ui-gate-public-dedupe-control-fired ui-gate-public-token-control-fired

  # =========================================================================
  # Job 3 -- Phase-close baselines: vote-engine suite + authority typecheck.
  # No `needs:` -- runs independently of the other two jobs.
  # =========================================================================
  baselines:
    name: "Phase-close baselines - vote-engine suite and authority typecheck"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (pinned Yarn 4.7.0)
        run: |
          set -euo pipefail
          corepack enable
          echo "RECEIPT toolchain node=$(node --version) yarn=$(yarn --version)" | tee -a ci-receipt.txt

      - name: Cache Yarn global cache
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install workspace dependencies
        run: |
          set -euo pipefail
          yarn install --immutable

      - name: Build workspace packages
        run: |
          set -euo pipefail
          yarn workspaces foreach -At --include 'packages/*' run build

      # This runs BEFORE any verdict the checker produces below is trusted --
      # the same discipline --prove-trap applies to the tier-2 gate.
      - name: Prove the baseline checker can fail
        run: |
          set -euo pipefail
          node scripts/assert-ci-baselines.mjs selftest
          echo "RECEIPT baseline-checker-selftest" | tee -a ci-receipt.txt

      # The vote-engine suite exits non-zero BY DESIGN (8 known pre-existing
      # failures) -- this step must capture the log without letting that exit
      # code end the job, and must not unconditionally swallow its own exit
      # status (that would also hide a genuine crash). The checker is the
      # verdict, not this exit code: its
      # "no mocha summary found" branch is what stops a mocha that crashed
      # before running anything from sailing through this deliberately
      # tolerated non-zero exit.
      #
      # --ci selects ci-baselines.json's voteEngine.ciMinPassing floor, which
      # is deliberately one lower than the local minPassing: `.planning/` is a
      # nested, gitignored git repo with zero tracked files in the outer tree,
      # so it never exists on this checkout. One test (strand-cohort-routing-
      # coverage.spec.ts's diagnosis-doc check) guards on that and calls
      # this.skip() when absent, reporting as pending here instead of passing
      # -- visibly, never a silent pass. The failing count and titles are
      # unaffected in both environments.
      - name: vote-engine suite
        run: |
          set -euo pipefail
          if ! yarn workspace @votetorrent/vote-engine test 2>&1 | tee vote-engine.log; then
            echo "mocha exited non-zero (expected: known failures); the checker decides"
          fi
          node scripts/assert-ci-baselines.mjs vote-engine vote-engine.log --ci | tee -a ci-receipt.txt

      # apps/VoteTorrentAuthority has 51 known pre-existing tsc errors, so
      # `tsc --noEmit` also exits non-zero by design. This is a CEILING: the
      # producer half this phase added to that app must introduce none.
      - name: Authority typecheck ceiling
        run: |
          set -euo pipefail
          # The TSC-RAN marker carries the compiler's REAL exit status into the
          # log the checker reads. Without it, a clean `tsc --noEmit` (which
          # prints nothing) is byte-identical to a log from a step that
          # crashed before running anything -- and the checker, seeing zero
          # diagnostics, would pass vacuously and suggest lowering the ceiling.
          tsc_status=0
          yarn workspace votetorrent-authority typecheck > authority-tsc.log 2>&1 || tsc_status=$?
          cat authority-tsc.log
          if [ "$tsc_status" -ne 0 ]; then
            echo "tsc exited $tsc_status (expected: known errors); the checker decides"
          fi
          echo "TSC-RAN exit=${tsc_status}" | tee -a authority-tsc.log
          node scripts/assert-ci-baselines.mjs authority-typecheck authority-tsc.log | tee -a ci-receipt.txt

      # Recorded, deliberately not run -- this phase touches nothing in the
      # voter, and importing an unrelated red baseline into this gate would
      # make it less trustworthy, not more. Echoed to the run summary so it
      # cannot be silently forgotten.
      - name: Record the baseline not enforced here
        run: |
          set -euo pipefail
          node -e "
            const b = JSON.parse(require('fs').readFileSync('scripts/ci-baselines.json', 'utf8'));
            const v = b.notEnforcedHere.voterJest;
            console.log('NOT ENFORCED HERE — apps/VoteTorrentVoter jest: ' + v.failingSuites + ' suite(s) failing on ' + v.cause + ' (measured ' + v.measuredOn + '). ' + v.reason);
          " | tee -a "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

      - name: Receipts
        run: |
          set -euo pipefail
          node scripts/assert-ci-baselines.mjs receipts ci-receipt.txt \
            toolchain baseline-checker-selftest vote-engine-baseline authority-typecheck-baseline
