<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoteTorrent Voter</title>
<style>
/* ============================================================================
   Design tokens — transcribed verbatim from
   apps/VoteTorrentVoter/src/theme/themes.ts (lightTheme / darkTheme)
   ========================================================================= */
:root{
  --primary:#2196f3; --background:#fbfbfb; --surface:#fcfcfc; --card:#ffffff;
  --text:#000000; --textSecondary:#7d7d7d; --border:#e5e5e5; --notification:#FF3B30;
  --secondary:#000000; --accent:#d9d9d9; --error:#971d1d; --warning:#bcb600;
  --contrast:#262626; --success:#4caf50; --dark:#000000; --light:#ffffff;
  --important:#e8e3ad; --muted:#9e9e9e;
  --link:#2196f3; --progressFill:#34c759; --progressTrack:#e5e5e5;
  --secondaryButtonSurface:#f5f5f5;
  --registerNegative:#ef5644; --registerPositive:#3ebd5d; --validBadge:#e6c200;
  /* radii scale (theme/themes.ts `radii`) */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  /* globalStyles.cardSurface boxShadow */
  --cardShadow:0px 4px 16px 0px rgba(0,0,0,0.16);
  --statusbar:#0d47a1;
}
:root[data-theme="dark"]{
  --primary:#237ec7; --background:#0d0d0d; --surface:#1c1c1c; --card:#1e1e1e;
  --text:#ebebeb; --textSecondary:#828282; --border:#333333; --notification:#ba1e15;
  --secondary:#ebebeb; --accent:#262626; --error:#d07a7a; --warning:#ece756;
  --contrast:#d9d9d9; --success:#699a6b; --dark:#000000; --light:#ffffff;
  --important:#474421; --muted:#616161;
  --link:#237ec7; --progressFill:#51b269; --progressTrack:#2a2a2a;
  --secondaryButtonSurface:#2a2a2a;
  --registerNegative:#ef5644; --registerPositive:#3ebd5d; --validBadge:#e6c200;
  --cardShadow:0px 4px 16px 0px rgba(0,0,0,0.5);
  --statusbar:#000000;
}

/* Type scale — theme/themes.ts `type` (fontSize / lineHeight) */
.t-display{font-size:40px;line-height:48px}
.t-h1{font-size:32px;line-height:40px}
.t-h2{font-size:28px;line-height:34px}
.t-h3{font-size:24px;line-height:30px}
.t-h4{font-size:20px;line-height:26px}
.t-body{font-size:16px;line-height:22px}
.t-caption{font-size:16px;line-height:20px}
.w-regular{font-weight:400}.w-medium{font-weight:500}.w-bold{font-weight:700}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  /* fonts.regular.fontFamily === 'System' in themes.ts */
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  background:#3a3a3c;color:var(--text);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:0;
}
@media (min-width:900px){ body{padding:24px} }

/* ---- Phone frame: Pixel 8 == 412 x 915 dp ---- */
#device{
  width:412px;height:915px;max-width:100vw;max-height:100vh;
  position:relative;overflow:hidden;background:var(--background);
  display:flex;flex-direction:column;
}
@media (min-width:900px){
  #device{border-radius:34px;box-shadow:0 24px 70px rgba(0,0,0,.55);border:8px solid #101012;height:931px}
}
@media (max-width:911px){ #device{width:100vw;height:100vh;height:100dvh} }

/* ---- Android status bar ---- */
#statusbar{
  flex:0 0 auto;height:28px;background:var(--statusbarBg,transparent);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;font-size:12px;font-weight:600;color:var(--sbFg,var(--text));
  position:relative;z-index:5;
}
#statusbar .sb-icons{display:flex;gap:5px;align-items:center}

/* ---- native-stack header (@react-navigation/native-stack default, Android) ---- */
.navheader{
  flex:0 0 auto;min-height:56px;background:var(--card);
  display:flex;align-items:center;gap:4px;padding:0 4px;
  border-bottom:1px solid var(--border);position:relative;z-index:4;
}
.navheader .hbtn{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border:0;background:none;color:var(--text);cursor:pointer;border-radius:50%;
}
.navheader .hbtn:active{background:rgba(128,128,128,.18)}
.navheader .htitle{
  font-size:20px;font-weight:500;color:var(--text);
  padding-left:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.navheader.has-btn .htitle{padding-left:4px}

/* ---- screen body ---- */
#screen{flex:1 1 auto;position:relative;overflow:hidden;background:var(--background);display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.screenpad{padding:16px}              /* globalStyles.container */
.fill{flex:1;display:flex;flex-direction:column}

/* ---- bottom tab bar (createBottomTabNavigator) ---- */
#tabbar{
  flex:0 0 auto;height:62px;background:var(--card);border-top:1px solid var(--border);
  display:flex;align-items:stretch;position:relative;z-index:4;
}
#tabbar.hidden{display:none}
#tabbar .tab{
  flex:1;border:0;background:none;cursor:pointer;padding:7px 0 9px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--textSecondary);
}
#tabbar .tab .tlabel{font-size:12px;font-weight:700;letter-spacing:.1px}
#tabbar .tab.active{color:var(--primary)}

/* ---- shared surfaces ---- */
/* globalStyles.cardSurface */
.cardSurface{
  border-radius:16px;padding:16px;margin:10px 4px;background:var(--card);
  box-shadow:var(--cardShadow);
}
.btn{
  border:0;cursor:pointer;font:inherit;display:flex;align-items:center;justify-content:center;
  text-align:center;width:100%;
}
.btn:active{filter:brightness(.94)}
.btn-solid{background:var(--primary);color:var(--light);border-radius:var(--r-pill);font-weight:600}
.btn-outline{
  background:var(--secondaryButtonSurface);color:var(--primary);
  border:1px solid var(--primary);border-radius:var(--r-pill);font-weight:600;
}
.btn-44{min-height:44px;padding:0 24px}
.btn-48{min-height:48px;padding:14px 24px}
.btn-52{min-height:52px;padding:14px 24px}

/* ProgressBar */
.pbar{height:8px;border-radius:var(--r-pill);background:var(--progressTrack);overflow:hidden}
.pbar>i{display:block;height:8px;border-radius:var(--r-pill);background:var(--progressFill)}

/* breadcrumb */
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.breadcrumb .crumb{font-size:16px;line-height:20px;color:var(--textSecondary);background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
.breadcrumb .crumb.current{color:var(--text);font-weight:500;cursor:default}

.link{color:var(--link);text-decoration:underline;background:none;border:0;padding:0;cursor:pointer;font-family:inherit;font-size:16px;line-height:20px;text-align:left}

/* ---- modal / dialog layers ---- */
#overlays{position:absolute;inset:0;z-index:50;pointer-events:none}
#overlays>*{pointer-events:auto}
#overlays:empty{display:none}
.overlay{position:absolute;inset:0;z-index:40;display:flex}
.overlay.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* InfoDialog backdrop */
.dlg-backdrop{background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:0 24px}
.dlg-card{
  width:100%;max-width:420px;background:var(--card);border-radius:var(--r-lg);
  padding:48px 24px 40px;display:flex;flex-direction:column;align-items:center;position:relative;
}
.dlg-close{position:absolute;top:16px;right:16px;background:none;border:0;cursor:pointer;color:var(--text);padding:0}
.dlg-title{font-size:20px;line-height:26px;font-weight:700;text-align:center;margin:0 0 16px;color:var(--text)}
.dlg-sub{font-size:16px;line-height:22px;font-weight:500;text-align:center;margin:0 0 32px;color:var(--text)}
.dlg-body{font-size:16px;line-height:20px;text-align:center;margin:0;color:var(--textSecondary)}
/* PartyDropdown sheet */
.sheet-backdrop{background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:0 24px}
.sheet{width:100%;background:var(--card);border-radius:var(--r-lg);padding:0 16px}
.sheet .opt{
  display:flex;align-items:center;gap:12px;min-height:52px;padding:16px 0;width:100%;
  background:none;border:0;cursor:pointer;font:inherit;color:var(--text);text-align:left;
}
.sheet .opt span{flex:1;font-size:16px;line-height:22px}
.sheet .odiv{height:1px;background:var(--border)}
/* presentation:'modal' route — slides up over the whole app, own header w/ X */
.routemodal{
  position:absolute;left:0;right:0;top:16px;bottom:0;z-index:30;background:var(--background);
  border-radius:12px 12px 0 0;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 -6px 28px rgba(0,0,0,.35);animation:slideup .26s cubic-bezier(.2,.8,.2,1);
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.routemodal .navheader{border-radius:12px 12px 0 0}
.modal-scrim{position:absolute;inset:0;z-index:29;background:rgba(0,0,0,.28)}

/* ---- FieldGroup ---- */
.fgcard{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card);padding:0 16px}
.fgrow{padding:16px 0}
.fgrow .fgdiv{height:1px;background:var(--border)}
.fgrow input{
  width:100%;border:0;outline:0;background:none;padding:0;font-family:inherit;
  font-size:16px;line-height:22px;color:var(--text);
}
.fgrow input::placeholder{color:var(--textSecondary)}
.fgrow.err input::placeholder{color:var(--error)}
.fgerr{margin-top:4px;font-size:16px;line-height:20px;color:var(--error)}
.fgdivider{height:1px;background:var(--border)}

/* StepDots */
.stepdots{display:flex;justify-content:center;align-items:center;gap:8px}
.stepdots i{width:8px;height:8px;border-radius:var(--r-pill);background:var(--progressTrack);display:block}
.stepdots i.on{width:24px;background:var(--primary)}

/* spinner (ActivityIndicator) */
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--primary);border-top-color:transparent;animation:spin .9s linear infinite}
.spinner.sm{width:26px;height:26px;border-width:2.5px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- dev drawer (prototype-only affordance) ---- */
#devfab{
  position:absolute;right:12px;bottom:74px;z-index:45;width:44px;height:44px;border-radius:50%;
  background:#111;color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);
}
#devdrawer{position:absolute;inset:0;z-index:60;background:var(--background);display:none;flex-direction:column}
#devdrawer.open{display:flex}
#devdrawer .dhead{
  padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  justify-content:space-between;background:var(--card);
}
#devdrawer .dhead h2{margin:0;font-size:18px;font-weight:700;color:var(--text)}
#devdrawer .dbody{flex:1;overflow-y:auto;padding:12px 16px 28px}
.dgroup{margin-top:18px}
.dgroup:first-child{margin-top:4px}
.dgroup h3{
  margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--textSecondary);
}
.ditem{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:11px 12px;margin-bottom:6px;
  background:var(--card);border:1px solid var(--border);border-radius:10px;cursor:pointer;
  font-family:inherit;font-size:15px;color:var(--text);
}
.ditem:active{background:var(--secondaryButtonSurface)}
.ditem .dsub{display:block;font-size:12px;color:var(--textSecondary);margin-top:2px}
.badge{
  flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 7px;border-radius:999px;
  background:#fde2df;color:#a02216;text-transform:uppercase;
}
:root[data-theme="dark"] .badge{background:#4a1b16;color:#f0a79c}
.badge.state{background:#e3f0fd;color:#14538f}
:root[data-theme="dark"] .badge.state{background:#14304a;color:#8ec4f5}
.dnote{font-size:12px;line-height:17px;color:var(--textSecondary);margin:2px 0 10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{
  flex:1;min-width:78px;min-height:38px;padding:0 12px;border-radius:var(--r-pill);cursor:pointer;
  background:var(--secondaryButtonSurface);color:var(--textSecondary);border:1px solid var(--border);
  font-family:inherit;font-size:14px;
}
.seg button.on{background:var(--primary);color:var(--light);border-color:var(--primary);font-weight:700}
</style>
</head>
<body>

<div id="device">
  <div id="statusbar">
    <span id="sb-clock">10:30</span>
    <span class="sb-icons" id="sb-icons"></span>
  </div>
  <div id="chrome"></div>
  <div id="screen"></div>
  <div id="tabbar"></div>
  <!-- RN <Modal> renders above the whole app window — header + tab bar included. -->
  <div id="overlays"></div>
  <button id="devfab" title="All screens (prototype navigator)" aria-label="All screens"></button>
  <div id="devdrawer" role="dialog" aria-label="All screens"></div>
</div>

/* --- BallotSelectionProvider logic (verbatim semantics) --- */
function toggleCandidate(officeId,candidateId,voteFor){
  const cur = S.selectionMap[officeId] || [];
  if(voteFor===1){ S.selectionMap[officeId] = (cur[0]===candidateId) ? [] : [candidateId]; return; }
  if(cur.includes(candidateId)){ S.selectionMap[officeId]=cur.filter(i=>i!==candidateId); return; }
  if(cur.length>=voteFor) return;                 // at cap → silent no-op (Pitfall 4)
  S.selectionMap[officeId]=cur.concat([candidateId]);
}
function computeCompletedCount(){
  return {completed:OFFICES.filter(o=>(S.selectionMap[o.id]||[]).length>0).length,total:OFFICES.length};
}
function resolveSelectionSummary(office){
  const ids=S.selectionMap[office.id]||[];
  if(!ids.length) return {summary:t('ballot','notYetAnswered'),hasSelection:false};
  return {summary:ids.map(id=>office.candidates.find(c=>c.id===id)).filter(Boolean)
           .map(c=>t('ballot',c.nameKey)).join(', '),hasSelection:true};
}
/* --- utils/registrationForm.ts --- */
const maskDateInput = v => { const d=v.replace(/\D/g,'').slice(0,8);
  return d.length<=2?d : d.length<=4?d.slice(0,2)+'/'+d.slice(2) : d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4); };
const isValidEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());
const isValidPhone = v => v.replace(/\D/g,'').length>=10;
function isValidDob(v){ const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v.trim()); if(!m) return false;
  const mm=+m[1],dd=+m[2],yy=+m[3];
  return !(mm<1||mm>12||dd<1||dd>31||yy<1900||yy>2100); }
function validatePersonal(d){ const e={};
  ['firstName','lastName','dob','email','phone'].forEach(f=>{ if(!d[f].trim()) e[f]='required'; });
  if(!e.email && !isValidEmail(d.email)) e.email='email';
  if(!e.phone && !isValidPhone(d.phone)) e.phone='phone';
  if(!e.dob   && !isValidDob(d.dob))     e.dob='dob';
  return e; }
function validateAddressParty(d){ const e={};
  if(!d.addressLine1.trim()) e.addressLine1='required';
  if(!d.party) e.party='party';
  return e; }
/* --- RegistrationCard.computeValidThrough --- */
function computeValidThrough(iso){ if(!iso) return '';
  const d=new Date(iso); d.setFullYear(d.getFullYear()+1);
  return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+'/'+String(d.getFullYear()).slice(-2); }

/** CountdownTimer — components/CountdownTimer.tsx (live, recomputed from target). */
function CountdownTimer(target){
  const pad=n=>String(n).padStart(2,'0');
  const ms=Math.max(0,target-Date.now()), tot=Math.floor(ms/1000);
  const g=[[pad(Math.floor(tot/3600)),'countdown.hours'],[pad(Math.floor(tot%3600/60)),'countdown.minutes'],[pad(tot%60),'countdown.seconds']];
  const digit='class="t-display w-regular" style="color:var(--text)"';
  return '<div class="countdown" data-target="'+target+'" style="display:flex;align-items:flex-start">'
    + g.map((x,i)=>(i>0?'<span '+digit+'>:</span>':'')
        +'<div style="display:flex;flex-direction:column;align-items:center;margin:0 4px">'
        +'<span '+digit+'>'+x[0]+'</span>'
        +'<span class="t-caption" style="color:var(--textSecondary);text-transform:uppercase;letter-spacing:1px;margin-top:4px">'
          +esc(t('home',x[1]))+'</span></div>').join('')

}

/* ---------------------------------------------------------------------------
 * 8. RENDER
 * ------------------------------------------------------------------------ */
function navHeader(route,isModal){
  const def=SCREENS[route];
  const title=def.title?def.title():'';
  const canBack = isModal || stack().length>1;
  let btn='';
  if(isModal) btn='<button class="hbtn" data-act="back" aria-label="'+esc(t('common','close'))+'">'+icon('xmark',22)+'</button>';
  else if(canBack) btn='<button class="hbtn" data-act="back" aria-label="Back">'+icon('arrow-left',22)+'</button>';
  return '<div class="navheader'+(btn?' has-btn':'')+'"><div style="width:'+(btn?'0':'12')+'px"></div>'+btn
    +'<div class="htitle">'+esc(title)+'</div></div>';
}

function render(){
  document.documentElement.setAttribute('data-theme',S.theme);

  /* --- app-level gates (VoterAppProvider) --- */
  if(S.appState!=='ready'){
    document.getElementById('chrome').innerHTML='';
    document.getElementById('overlays').innerHTML='';
    document.getElementById('tabbar').className='hidden';
    document.getElementById('screen').innerHTML = S.appState==='booting'
      ? '<div class="fill" style="align-items:center;justify-content:center;background:'+(S.theme==='dark'?'#0d0d0d':'#fff')+'">'
        +'<div class="spinner"></div></div>'
      : '<div class="fill" style="align-items:center;justify-content:center;background:'+(S.theme==='dark'?'#0d0d0d':'#fff')+';padding:24px">'
        +'<div style="margin-bottom:16px;text-align:center;font-size:14px;color:var(--text)">'
          +'Failed to load network: Error: seedDevNetwork failed: no valid addresses for peer</div>'
        +'<button data-act="boot-retry" style="margin-bottom:8px;background:none;border:0;font-family:inherit;'
          +'font-size:14px;color:var(--text);cursor:pointer">Try Again</button>'
        +'<button data-act="boot-fresh" style="background:none;border:0;font-family:inherit;font-size:14px;'
          +'color:var(--text);cursor:pointer">Start Fresh</button></div>';
    paintStatusBar(false);
    renderDevFabState();
    return;
  }

  const baseRoute = stack()[stack().length-1];
  const baseDef   = SCREENS[baseRoute];

  /* header chrome (only for the base stack screen; modal routes carry their own) */
  document.getElementById('chrome').innerHTML =
    baseDef.header==='stack' ? navHeader(baseRoute,false) : '';

  /* screen body */
  let html = baseDef.body();
  if(S.routeModal){
    const m=SCREENS[S.routeModal];
    html += '<div class="modal-scrim"></div>'
      + '<div class="routemodal">'+navHeader(S.routeModal,true)
      + '<div class="fill" style="overflow:hidden">'+m.body()+'</div></div>';
  }
  document.getElementById('screen').innerHTML = html;

  /* RN <Modal>-backed overlays live above the whole app window (header + tab bar included). */
  document.getElementById('overlays').innerHTML =
    (S.dialog ? InfoDialogHTML(S.dialog) : '') + (S.sheet ? PartySheetHTML() : '');

  /* tab bar — hidden across the register form flow (navigation/index.tsx) */
  const hideTabs = S.tab==='Registration' && REGISTRATION_FULLSCREEN_ROUTES.includes(baseRoute);
  const tb=document.getElementById('tabbar');
  tb.className = hideTabs ? 'hidden' : '';
  tb.innerHTML = TABS.map(x=>'<button class="tab'+(S.tab===x.name?' active':'')+'" data-tab="'+x.name+'">'
    +icon(x.glyph,24)+'<span class="tlabel">'+esc(t('common',x.labelKey))+'</span></button>').join('');

  paintStatusBar(baseDef.header==='none' && (baseRoute==='Home'||baseRoute==='RegistrationHome'));
  renderDevFabState();

  /* DeviceAttestationScreen's focus effect: probe resolves → replace('RegisterPersonal') */
  if(baseRoute==='DeviceAttestation' && !S.attestTerminal && !S.routeModal){
    clearTimeout(S.attestTimer);
    S.attestTimer=setTimeout(()=>{ if(stack()[stack().length-1]==='DeviceAttestation'){ replaceTop('RegisterPersonal'); } },2200);
  }
}

  const f=document.getElementById('devfab');
  f.innerHTML=icon('list-check',18,'#fff');

    +'<rect x="11.1" y="0" width="2.5" height="11" rx=".6" opacity=".45"/></svg>'

/* ---------------------------------------------------------------------------
 * 9. INTERACTIONS
 * ------------------------------------------------------------------------ */
const ACTIONS={
  noop(){},
  back:goBack,
  'pop-to-top':popToTop,

  /* Home */
  'cycle-lifecycle'(){ const i=LIFECYCLE_ORDER.indexOf(S.lifecycleState);
    S.lifecycleState=LIFECYCLE_ORDER[(i+1)%LIFECYCLE_ORDER.length]; render(); },
  'vote-now'(){ push('Ballot'); },
  'validation-details'(){ push('ValidationDetails'); },
  'dlg-election'(){ S.dialog={ns:'home',key:'electionInfo'}; render(); },

  /* Ballot */
  'continue-voting'(){
    const i=OFFICES.findIndex(o=>!(S.selectionMap[o.id]||[]).length);
    S.currentQuestionIndex = i>=0?i:0; openModal('IndividualQuestion'); },
  'open-office'(el){ S.currentQuestionIndex=OFFICES.findIndex(o=>o.id===el.dataset.id);
    openModal('IndividualQuestion'); },
  'dlg-office'(){ S.dialog={ns:'ballot',key:'officeInfo'}; render(); },
  'dlg-candidate'(){ S.dialog={ns:'ballot',key:'candidateInfo'}; render(); },
  'go-review'(){ S.submitted=false; push('ReviewSubmit'); },

  /* Individual question */
  'toggle-cand'(el){ const o=OFFICES[S.currentQuestionIndex];
    toggleCandidate(o.id,el.dataset.id,o.voteFor); render(); },
  'prev-question'(){ S.currentQuestionIndex=Math.max(0,S.currentQuestionIndex-1); render(); },
  'next-question'(){
    if(S.currentQuestionIndex===OFFICES.length-1){
      // navigation.replace('ReviewSubmit') — swaps the IndividualQuestion modal route for
      // ReviewSubmit in place, so Android back from Review lands on Ballot, not a re-opened
      // modal at the last question (42-RESEARCH Pattern 7 / Assumption A2).
      S.routeModal=null; S.submitted=false; push('ReviewSubmit'); return; }
    S.currentQuestionIndex=Math.min(OFFICES.length-1,S.currentQuestionIndex+1); render(); },
  'submit-ballot'(){ S.submitted=true; render(); },

  /* Registration */
  'toggle-registered'(){ S.isRegistered=!S.isRegistered;
    if(S.isRegistered) S.registeredAt=new Date().toISOString(); render(); },
  'register-now'(){ S.attestTerminal=false; push('DeviceAttestation'); },
  'update-registration'(){ S.errors={}; push('RegisterPersonal'); },
  'reg-help'(){ openModal('RegistrationInfo'); },
  'reg-info-noop'(){},
  'continue-personal'(){ S.errors=validatePersonal(S.draft);
    if(!Object.keys(S.errors).length){ push('RegisterAddressParty'); } else render(); },
  'continue-address'(){ S.errors=validateAddressParty(S.draft);
    if(!Object.keys(S.errors).length){ push('RegisterConfirm'); } else render(); },
  'open-party'(){ S.sheet=true; render(); },
  'pick-party'(el){ S.draft.party=el.dataset.key; delete S.errors.party; S.sheet=null; render(); },
  'close-sheet'(){ S.sheet=null; render(); },
  'submit-registration'(){ S.confirmFailure=null; push('Confirmation'); },
  'confirm-faceid'(){
    if(S.isSubmitting) return;
    S.isSubmitting=true; render();
    setTimeout(()=>{ S.isSubmitting=false;
      if(S.confirmFailure){ S.confirmFailure=null; render(); return; }   // retry → success
      S.isRegistered=true; S.registeredAt=new Date().toISOString();
      popToTop();                                                        // clears the whole chain
    },1100); },
  'setup-unlock'(){ S.confirmFailure=null; render(); },

  /* dialogs */
  'close-dialog'(){ S.dialog=null; render(); },

  /* Settings */
  'set-lang'(el){ S.lang=el.dataset.lang; render(); },

  /* boot gates */
  'boot-retry'(){ S.appState='booting'; render(); setTimeout(()=>{S.appState='ready';render();},1400); },
  'boot-fresh'(){ S.appState='ready'; render(); },
};

document.addEventListener('click',ev=>{
  const stop=ev.target.closest('[data-stop]');
  const holder=ev.target.closest('[data-act]');
  if(holder){
    /* InfoDialog/PartyDropdown wrap their card in an inner Pressable that swallows taps: a click
       inside [data-stop] must not reach the backdrop's close action sitting ABOVE it. */
    if(stop && holder.contains(stop)) return;
    const fn=ACTIONS[holder.dataset.act];
    if(fn){ ev.preventDefault(); fn(holder); return; }
  }
  const tab=ev.target.closest('[data-tab]');
  if(tab){ switchTab(tab.dataset.tab); return; }
  const dev=ev.target.closest('[data-dev]');
  if(dev){ devGo(dev.dataset.dev); return; }
});
/* write-through binding to RegistrationDraftProvider */
document.addEventListener('input',ev=>{
  const el=ev.target.closest('[data-field]'); if(!el) return;
  const f=el.dataset.field;
  let v=el.value;
  if(el.dataset.mask==='date'){ v=maskDateInput(v); el.value=v; }
  S.draft[f]=v;
  if(S.errors[f]){ delete S.errors[f]; const pos=el.selectionStart; render();
    const again=document.querySelector('[data-field="'+f+'"]'); if(again){again.focus();
      try{again.setSelectionRange(pos,pos);}catch(_){} } }
});
/* live countdown tick (CountdownTimer's 1s interval) */
setInterval(()=>{
  document.querySelectorAll('.countdown').forEach(node=>{
    const target=+node.dataset.target;
    const ms=Math.max(0,target-Date.now()), tot=Math.floor(ms/1000), pad=n=>String(n).padStart(2,'0');
    const vals=[pad(Math.floor(tot/3600)),pad(Math.floor(tot%3600/60)),pad(tot%60)];
    node.querySelectorAll('div > span:first-child').forEach((s,i)=>{ if(vals[i]!==undefined) s.textContent=vals[i]; });
  });
  const c=document.getElementById('sb-clock'); const n=new Date();
  if(c) c.textContent=n.getHours()+':'+String(n.getMinutes()).padStart(2,'0');
},1000);

function buildDrawer(){
  const d=document.getElementById('devdrawer');
  d.innerHTML='<div class="dhead"><h2>All screens</h2>'
    +'<button data-act="close-drawer" style="background:none;border:0;cursor:pointer;color:var(--text);padding:6px">'
      +icon('xmark',20)+'</button></div>'
   +'<div class="dbody">'
     +'<div class="dgroup"><h3>Appearance</h3><div class="seg">'
       +'<button data-dev="theme:light" class="'+(S.theme==='light'?'on':'')+'">Light</button>'
       +'<button data-dev="theme:dark" class="'+(S.theme==='dark'?'on':'')+'">Dark</button>'
       +'<button data-dev="lang:en" class="'+(S.lang==='en'?'on':'')+'">English</button>'
       +'<button data-dev="lang:es" class="'+(S.lang==='es'?'on':'')+'">Español</button>'
     +'</div></div>'
     +DEV_GROUPS.map(g=>'<div class="dgroup"><h3>'+esc(g.title)+'</h3>'
        +(g.note?'<div class="dnote">'+esc(g.note)+'</div>':'')
        +g.items.map(i=>'<button class="ditem" data-dev="'+i.id+'"><span style="flex:1">'+esc(i.label)
          +(i.sub?'<span class="dsub">'+esc(i.sub)+'</span>':'')+'</span>'
          +(i.badge?'<span class="badge '+(i.badge==='state'?'state':'')+'">'+(i.badge==='state'?'state':'unreachable')+'</span>':'')
          +'</button>').join('')
      +'</div>').join('')
   +'</div>';
}
ACTIONS['close-drawer']=()=>{ document.getElementById('devdrawer').classList.remove('open'); };
document.getElementById('devfab').addEventListener('click',()=>{
  buildDrawer(); document.getElementById('devdrawer').classList.add('open');
});

/* Fills the draft so registered / confirm / review screens show real content. */
const SAMPLE_DRAFT={firstName:'Alex',lastName:'Rivera',dob:'04/17/1988',email:'alex.rivera@example.com',
  phone:'(801) 555-0142',addressLine1:'482 Canyon Rd',addressLine2:'Apt 3B',addressLine3:'Salt Lake City, UT 84103',party:'independent'};

function devGo(id){
  document.getElementById('devdrawer').classList.remove('open');
  const reset=()=>{ S.routeModal=null; S.dialog=null; S.sheet=null; S.errors={};
    S.attestTerminal=false; S.confirmFailure=null; S.submitted=false; S.appState='ready'; };

  if(id.startsWith('theme:')){ S.theme=id.split(':')[1]; buildDrawer();
    document.getElementById('devdrawer').classList.add('open'); render(); return; }
  if(id.startsWith('lang:')){ S.lang=id.split(':')[1]; buildDrawer();
    document.getElementById('devdrawer').classList.add('open'); render(); return; }
  if(id.startsWith('lifecycle:')){ reset(); S.lifecycleState=id.split(':')[1]; S.hasVoted=false;
    S.tab='Vote'; S.stacks.Vote=['Home']; afterNav(); return; }

  reset();
  switch(id){
    /* Home / lifecycle */
    case 'voted': S.lifecycleState='Open'; S.hasVoted=true; S.tab='Vote'; S.stacks.Vote=['Home']; break;
    case 'Home':  S.hasVoted=false; S.tab='Vote'; S.stacks.Vote=['Home']; break;

    /* Vote stack */
    case 'Ballot':            S.tab='Vote'; S.stacks.Vote=['Home','Ballot']; break;
    case 'ballot-empty':      S.selectionMap={}; S.tab='Vote'; S.stacks.Vote=['Home','Ballot']; break;
    case 'ballot-full':       S.selectionMap={}; OFFICES.forEach(o=>{
        S.selectionMap[o.id]=o.candidates.slice(0,o.voteFor).map(c=>c.id); });
      S.tab='Vote'; S.stacks.Vote=['Home','Ballot']; break;
    case 'IndividualQuestion':S.tab='Vote'; S.stacks.Vote=['Home','Ballot']; S.currentQuestionIndex=0; S.routeModal='IndividualQuestion'; break;
    case 'question-checkbox': case 'question-at-cap': {
      const i=OFFICES.findIndex(o=>o.voteFor>1), o=OFFICES[i];
      S.selectionMap=Object.assign({},S.selectionMap,
        {[o.id]: id==='question-at-cap' ? o.candidates.slice(0,o.voteFor).map(c=>c.id) : []});
      S.tab='Vote'; S.stacks.Vote=['Home','Ballot']; S.currentQuestionIndex=i; S.routeModal='IndividualQuestion'; break; }
    case 'ReviewSubmit':      S.tab='Vote'; S.stacks.Vote=['Home','Ballot','ReviewSubmit']; break;
    case 'submitted':         S.tab='Vote'; S.stacks.Vote=['Home','Ballot','ReviewSubmit']; S.submitted=true; break;
    case 'ValidationDetails': S.lifecycleState='ValidationDetails'; S.tab='Vote'; S.stacks.Vote=['Home','ValidationDetails']; break;
    case 'ValidationDetailsLoading': S.tab='Vote'; S.stacks.Vote=['Home','ValidationDetailsLoading']; break;

    /* Vote-stack modal routes (unreachable in the app) */
    case 'ElectionInfo': case 'OfficeInfo': case 'CandidateInfo':
      S.tab='Vote'; S.stacks.Vote=['Home']; S.routeModal=id; break;
    case 'RegistrationInfo':
      S.tab='Registration'; S.stacks.Registration=['RegistrationHome']; S.routeModal='RegistrationInfo'; break;

    /* InfoDialogs */
    case 'dlg-election':  S.tab='Vote'; S.lifecycleState='Open'; S.stacks.Vote=['Home']; S.dialog={ns:'home',key:'electionInfo'}; break;
    case 'dlg-office':    S.tab='Vote'; S.stacks.Vote=['Home','Ballot']; S.dialog={ns:'ballot',key:'officeInfo'}; break;
    case 'dlg-candidate': S.tab='Vote'; S.stacks.Vote=['Home','Ballot']; S.currentQuestionIndex=0;
      S.routeModal='IndividualQuestion'; S.dialog={ns:'ballot',key:'candidateInfo'}; break;

    /* Registration stack */
    case 'RegistrationHome':  S.isRegistered=false; S.tab='Registration'; S.stacks.Registration=['RegistrationHome']; break;
    case 'registered':        S.isRegistered=true; S.registeredAt=new Date().toISOString();
      S.draft=Object.assign({},SAMPLE_DRAFT); S.tab='Registration'; S.stacks.Registration=['RegistrationHome']; break;
    case 'DeviceAttestation': S.tab='Registration'; S.stacks.Registration=['RegistrationHome','DeviceAttestation']; break;
    case 'attest-terminal':   S.attestTerminal=true; S.tab='Registration';
      S.stacks.Registration=['RegistrationHome','DeviceAttestation']; break;
    case 'RegisterPersonal':  S.draft=Object.assign({},EMPTY_DRAFT); S.tab='Registration';
      S.stacks.Registration=['RegistrationHome','RegisterPersonal']; break;
    case 'errors-personal':   S.draft=Object.assign({},EMPTY_DRAFT,{email:'not-an-email',phone:'123'});
      S.errors=validatePersonal(S.draft); S.tab='Registration';
      S.stacks.Registration=['RegistrationHome','RegisterPersonal']; break;
    case 'RegisterAddressParty': S.draft=Object.assign({},SAMPLE_DRAFT,{addressLine1:'',addressLine2:'',addressLine3:'',party:''});
      S.tab='Registration'; S.stacks.Registration=['RegistrationHome','RegisterPersonal','RegisterAddressParty']; break;
    case 'errors-address':    S.draft=Object.assign({},SAMPLE_DRAFT,{addressLine1:'',party:''});
      S.errors=validateAddressParty(S.draft); S.tab='Registration';
      S.stacks.Registration=['RegistrationHome','RegisterPersonal','RegisterAddressParty']; break;
    case 'party-sheet':       S.draft=Object.assign({},SAMPLE_DRAFT); S.sheet=true; S.tab='Registration';
      S.stacks.Registration=['RegistrationHome','RegisterPersonal','RegisterAddressParty']; break;
    case 'RegisterConfirm':   S.draft=Object.assign({},SAMPLE_DRAFT); S.tab='Registration';
      S.stacks.Registration=['RegistrationHome','RegisterPersonal','RegisterAddressParty','RegisterConfirm']; break;
    case 'Confirmation': case 'confirm-action': case 'confirm-transient': case 'confirm-terminal':
      S.draft=Object.assign({},SAMPLE_DRAFT);
      S.confirmFailure = id==='confirm-action'?'recoverable-action'
                       : id==='confirm-transient'?'recoverable-transient'
                       : id==='confirm-terminal'?'terminal':null;
      S.tab='Registration';
      S.stacks.Registration=['RegistrationHome','RegisterPersonal','RegisterAddressParty','RegisterConfirm','Confirmation']; break;

    /* Scan / Settings */
    case 'ScanHome':     S.tab='Scan';     S.stacks.Scan=['ScanHome']; break;
    case 'SettingsHome': S.tab='Settings'; S.stacks.Settings=['SettingsHome']; break;

    /* App-level */
    case 'booting':   S.appState='booting'; break;
    case 'bootError': S.appState='bootError'; break;
  }
  afterNav();
}

/* boot */
render();
