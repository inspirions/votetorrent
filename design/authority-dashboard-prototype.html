<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoteTorrent Authority Dashboard — prototype</title>
<style>
/* ============================================================================
   PROTOTYPE CHROME — the rail, the width picker, and the stage the app renders
   into. Deliberately a SEPARATE stylesheet from the app's: the app renders
   inside an <iframe> that receives only the #app-style sheet below, so no rule
   here can reach the app surface and no app rule can restyle the rail.

   The iframe is not decoration. shell.css and app.css collapse their layouts at
   @media (max-width:900px), and a media query reads the VIEWPORT — clamping a
   div's max-width would never fire one. An iframe has a viewport of its own, so
   the width buttons cross the real breakpoint.

   These tokens are a COPY of the app's, for the rail's own use. The app's
   authoritative set lives in the #app-style sheet below.
   ========================================================================= */
:root{
  --bg:#0d0f14; --surface:#151922; --surface2:#1b202b; --border:#2a3040;
  --text:#e9ecf2; --muted:#8d97a8; --primary:#3b82f6;
  --radius:10px;
  --space-xs:4px; --space-sm:8px; --space-md:16px; --space-lg:24px;
  --font-label-size:12px; --font-heading-size:16px;
}
html,body{height:100%;margin:0;padding:0}
body{background:#050609;color:var(--text);font-size:14px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
#proto{display:flex;min-height:100vh;align-items:stretch}
#rail{
  flex:0 0 264px;background:#07080b;border-right:1px solid var(--border);
  padding:var(--space-md);overflow-y:auto;max-height:100vh;position:sticky;top:0;
}
#rail h1{margin:0 0 var(--space-xs);font-size:var(--font-heading-size);font-weight:600}
#rail .sub{margin:0 0 var(--space-md);color:var(--muted);font-size:var(--font-label-size);line-height:1.4}
#rail .grp{margin:var(--space-md) 0 var(--space-xs);color:var(--muted);
  font-size:var(--font-label-size);text-transform:uppercase;letter-spacing:.06em}
#rail button.r{
  display:block;width:100%;text-align:left;background:transparent;color:var(--text);
  border:1px solid transparent;border-radius:var(--radius);
  padding:6px var(--space-sm);font:inherit;font-size:13px;cursor:pointer;margin-bottom:2px;
}
#rail button.r:hover{background:#12151d}
#rail button.r[aria-current="true"]{border-color:var(--primary);background:#12151d}
#rail .note{margin-top:var(--space-lg);padding-top:var(--space-md);border-top:1px solid var(--border);
  color:var(--muted);font-size:11px;line-height:1.5}
#rail code{font-family:ui-monospace,monospace;color:var(--text)}
#widths{display:flex;gap:var(--space-xs);margin-bottom:var(--space-sm)}
#widths button{flex:1;background:#12151d;color:var(--muted);border:1px solid var(--border);
  border-radius:var(--radius);font:inherit;font-size:11px;padding:4px 0;cursor:pointer}
#widths button[aria-pressed="true"]{color:var(--primary);border-color:var(--primary)}
#stagewrap{flex:1;min-width:0;display:flex;flex-direction:column;background:#050609;padding:var(--space-md)}
#stagelabel{color:var(--muted);font-size:11px;margin-bottom:var(--space-sm);font-family:ui-monospace,monospace}
#stage{flex:1;min-height:0;width:100%;margin:0 auto;display:block;background:var(--bg);
  border:1px solid var(--border);border-radius:var(--radius)}
@media (max-width:820px){
  #proto{flex-direction:column}
  #rail{flex:none;max-height:none;position:static;border-right:0;border-bottom:1px solid var(--border)}
}
</style>

<style id="app-style">
/* ============================================================================
   VoteTorrent Authority Dashboard — throwaway clickable prototype.

   Companion to design/voter-app-prototype.html, same idiom: ONE self-contained
   file, no build, no dependencies, design tokens and class names transcribed
   from the real source rather than reinvented.

   TRANSCRIBED FROM (source of truth — if these drift, this file is wrong):
     packages/ui-web/src/tokens.css            — every :root custom property
     packages/ui-web/src/components.css        — .pv-disclosure .lifecycle-pill .dt-*
     apps/VoteTorrentDashboard/src/app.css     — .layout .panel-grid
     .../src/screens/shell.css                 — .sh-*
     .../src/screens/preview-as.css            — .pv-*
     .../src/screens/bootstrap.css             — .bs-*
     .../src/screens/panels/panels.css         — .panel .pill
     .../src/screens/panels/election-ops.css   — .eo-*
     .../src/screens/panels/authority-admin.css— .aa-*
   Copy strings are verbatim from packages/ui-web/src/copy.js.
   Capability/scope/tier/site metadata is verbatim from
   apps/VoteTorrentDashboard/src/auth/capabilities.js.

   FIXTURE DATA IS SYNTHETIC BUT PRODUCTION-*SHAPED*: 32-byte ids render as
   43-char base64url, Network.Hash as 22-char base64url (H16), the sign-in code
   as 40 hex + "." + 43 base64url = 84 characters. A short fixture is how this
   repo has previously shipped a clipped code and an unstyled screen past every
   gate, so nothing here is shortened for looks.

   The left rail is PROTOTYPE CHROME, not product UI. Everything to the right of
   it is the app surface.
   ========================================================================= */

/* ---- tokens.css, verbatim ---- */
:root{
  --bg:#0d0f14; --surface:#151922; --surface2:#1b202b; --border:#2a3040;
  --text:#e9ecf2; --muted:#8d97a8; --primary:#3b82f6;
  --ok:#22c55e; --warn:#f59e0b; --fail:#ef4444; --done:#64748b;
  --radius:10px;
  --space-xs:4px; --space-sm:8px; --space-md:16px; --space-lg:24px;
  --space-xl:32px; --space-2xl:48px; --space-3xl:64px;
  --font-body-size:14px; --font-body-weight:400; --font-body-line-height:1.5;
  --font-label-size:12px; --font-label-weight:400; --font-label-line-height:1.4;
  --font-heading-size:16px; --font-heading-weight:600; --font-heading-line-height:1.2;
  --font-display-size:20px; --font-display-weight:600; --font-display-line-height:1.2;
  --font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
html,body{height:100%;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-family);
  font-size:var(--font-body-size);font-weight:var(--font-body-weight);
  line-height:var(--font-body-line-height);
}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
button,a[role="button"]{min-height:32px}

/* ---- app.css ---- */
.layout{display:grid;grid-template-columns:264px 1fr;gap:var(--space-md);padding:var(--space-md)}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.panel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--space-md)}

/* ---- bootstrap.css ---- */
.bs-screen{box-sizing:border-box;min-height:100%;max-width:420px;margin:0 auto;
  padding:var(--space-3xl) var(--space-md);display:flex;flex-direction:column;
  justify-content:center;gap:var(--space-md)}
.bs-title{margin:0;font-size:var(--font-display-size);font-weight:var(--font-display-weight);
  line-height:var(--font-display-line-height);color:var(--text)}
.bs-empty-body{margin:0;color:var(--muted);font-size:var(--font-body-size);
  font-weight:var(--font-body-weight);line-height:var(--font-body-line-height)}
.bs-form{display:flex;flex-direction:column;gap:var(--space-sm);padding:var(--space-lg);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.bs-label{color:var(--muted);font-size:var(--font-label-size);
  font-weight:var(--font-label-weight);line-height:var(--font-label-line-height)}
.bs-input{box-sizing:border-box;width:100%;min-height:32px;padding:var(--space-xs) var(--space-sm);
  background:var(--surface2);color:var(--text);border:1px solid var(--border);
  border-radius:var(--radius);font-family:var(--font-family);font-size:var(--font-body-size);
  line-height:var(--font-body-line-height);color-scheme:dark}
.bs-input:focus-visible{border-color:var(--primary)}
.bs-input:disabled{opacity:.5}
.bs-cta{margin-top:var(--space-xs);min-height:32px;padding:var(--space-xs) var(--space-md);
  background:var(--primary);color:var(--bg);border:1px solid var(--primary);
  border-radius:var(--radius);font-family:var(--font-family);font-size:var(--font-body-size);
  font-weight:var(--font-heading-weight);line-height:var(--font-body-line-height);cursor:pointer}
.bs-cta:hover:not(:disabled){opacity:.9}
.bs-cta:disabled{opacity:.5;cursor:default}
.bs-status{margin:0;padding:var(--space-sm) var(--space-md);background:var(--surface2);
  color:var(--muted);border:1px solid var(--border);border-radius:var(--radius);
  font-size:var(--font-label-size);font-weight:var(--font-label-weight);
  line-height:var(--font-label-line-height)}
.bs-alert{display:flex;flex-direction:column;gap:var(--space-sm);padding:var(--space-md);
  background:var(--surface);border:1px solid var(--fail);border-radius:var(--radius)}
.bs-alert-heading{margin:0;color:var(--fail);font-size:var(--font-heading-size);
  font-weight:var(--font-heading-weight);line-height:var(--font-heading-line-height)}
.bs-alert-body{margin:0;color:var(--text);font-size:var(--font-body-size);
  font-weight:var(--font-body-weight);line-height:var(--font-body-line-height)}
.bs-alert-cta{margin:0;color:var(--muted);font-size:var(--font-label-size);
  font-weight:var(--font-label-weight);line-height:var(--font-label-line-height)}

/* ---- shell.css ---- */
.sh-layout{display:flex;flex-direction:column;gap:var(--space-md);padding:var(--space-md)}
.sh-body{display:grid;grid-template-columns:220px 1fr;gap:var(--space-lg)}
@media (max-width:900px){.sh-body{grid-template-columns:1fr}}
.sh-topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-md);
  padding:var(--space-md);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);flex-wrap:wrap}
.sh-identity{display:flex;flex-direction:column;gap:var(--space-xs);min-width:0}
.sh-authority-name{font-size:var(--font-display-size);font-weight:var(--font-display-weight);
  line-height:var(--font-display-line-height);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-domain{font-size:var(--font-label-size);font-weight:var(--font-label-weight);
  line-height:var(--font-label-line-height);color:var(--muted)}
.sh-topbar-actions{display:flex;align-items:center;gap:var(--space-sm);flex-wrap:wrap}
.sh-switcher{position:relative}
.sh-switcher-button{background:var(--surface2);color:var(--text);border:1px solid var(--border);
  border-radius:var(--radius);padding:var(--space-xs) var(--space-sm);cursor:pointer}
.sh-switcher-list{position:absolute;top:calc(100% + var(--space-xs));left:0;z-index:10;
  min-width:260px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:var(--space-xs);display:flex;flex-direction:column;gap:var(--space-xs)}
.sh-switcher-row{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-xs);
  padding:var(--space-sm);border-radius:var(--radius);background:transparent;
  border:1px solid transparent;color:var(--text);text-align:left;width:100%;cursor:pointer}
.sh-switcher-row--active{border-color:var(--primary)}
.sh-switcher-row-name{font-size:var(--font-heading-size);font-weight:var(--font-heading-weight)}
.sh-switcher-row-meta{font-size:var(--font-label-size);color:var(--muted)}
.sh-switcher-redeem{color:var(--primary);font-size:var(--font-body-size);background:transparent;
  border:0;text-align:left;padding:var(--space-sm);cursor:pointer}
.sh-freshness{font-size:var(--font-body-size);color:var(--muted)}
.sh-stale-banner{display:block;color:var(--warn);font-size:var(--font-label-size);margin-top:var(--space-xs)}
.sh-refresh-cta{background:transparent;color:var(--primary);border:1px solid var(--primary);
  border-radius:var(--radius);padding:var(--space-xs) var(--space-sm);cursor:pointer}
.sh-kebab{position:relative}
.sh-kebab-button{background:transparent;color:var(--text);border:1px solid var(--border);
  border-radius:var(--radius);width:32px;height:32px;cursor:pointer}
.sh-kebab-menu{position:absolute;top:calc(100% + var(--space-xs));right:0;z-index:10;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-xs)}
.sh-kebab-item--destructive{color:var(--fail);background:transparent;border:none;
  padding:var(--space-sm);width:100%;text-align:left;cursor:pointer}
.sh-dialog{background:var(--surface);color:var(--text);border:1px solid var(--border);
  border-radius:var(--radius);padding:var(--space-lg);max-width:420px}
.sh-dialog-input{width:100%;background:var(--surface2);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--space-xs) var(--space-sm);margin:var(--space-sm) 0;color-scheme:dark}
.sh-dialog-actions{display:flex;justify-content:flex-end;gap:var(--space-sm);margin-top:var(--space-md)}
.sh-dialog-cta--destructive{background:var(--fail);color:var(--text);border:1px solid var(--fail);
  border-radius:var(--radius);padding:var(--space-xs) var(--space-md);cursor:pointer}
.sh-dialog-cta--destructive:disabled{opacity:.5}
.sh-dialog-cta--primary{background:var(--primary);color:var(--text);border:1px solid var(--primary);
  border-radius:var(--radius);padding:var(--space-xs) var(--space-md);cursor:pointer}
.sh-dialog-error{color:var(--fail);font-size:var(--font-label-size)}
.sh-sidebar{display:flex;flex-direction:column;gap:var(--space-lg)}
.sh-sidebar-group + .sh-sidebar-group{margin-top:var(--space-2xl)}
.sh-sidebar-heading{font-size:var(--font-label-size);font-weight:var(--font-label-weight);
  color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:var(--space-sm)}
.sh-sidebar-row{display:block;color:var(--text);padding:var(--space-xs) 0;font-size:var(--font-body-size)}
.sh-reveal-toggle{background:transparent;color:var(--muted);border:1px solid var(--border);
  border-radius:var(--radius);padding:var(--space-xs) var(--space-sm);
  margin-bottom:var(--space-md);cursor:pointer}
.sh-reveal-toggle[aria-pressed="true"]{color:var(--primary);border-color:var(--primary)}
.sh-toast{position:fixed;bottom:var(--space-lg);right:var(--space-lg);background:var(--surface);
  color:var(--ok);border:1px solid var(--ok);border-radius:var(--radius);
  padding:var(--space-sm) var(--space-md);z-index:20}
.sh-error-banner{background:var(--surface2);border:1px solid var(--fail);border-radius:var(--radius);
  padding:var(--space-md);color:var(--text)}

/* the prototype renders dialogs inline rather than via <dialog>.showModal(), so it
   stages its own backdrop — .sh-dialog::backdrop is unreachable without the real API */
.proto-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:30;
  display:flex;align-items:center;justify-content:center;padding:var(--space-md)}

/* ---- preview-as.css ---- */
.pv-control{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm);
  padding:var(--space-xs) var(--space-sm);border:1px solid var(--border);
  border-radius:var(--radius);background:var(--surface)}
.pv-control legend{padding:0 var(--space-xs);color:var(--muted);font-size:var(--font-label-size);
  font-weight:var(--font-label-weight);line-height:var(--font-label-line-height)}
.pv-row{display:inline-flex;align-items:center;gap:var(--space-xs)}
.pv-row label{font-size:var(--font-label-size)}
.pv-scope{display:inline-flex;align-items:center;padding:0 var(--space-xs);border-radius:var(--radius);
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  font-size:var(--font-label-size);font-weight:var(--font-label-weight);line-height:var(--font-label-line-height)}
.pv-badge{display:inline-flex;align-items:center;padding:0 var(--space-sm);border-radius:var(--radius);
  font-size:var(--font-label-size);font-weight:var(--font-label-weight);
  line-height:var(--font-label-line-height);color:var(--text)}
.pv-badge--real{border:1px solid var(--ok)}
.pv-badge--sim{border:1px solid var(--warn)}
.pv-reset{background:transparent;border:1px solid var(--border);border-radius:var(--radius);
  color:var(--text);padding:0 var(--space-sm);font-size:var(--font-label-size);cursor:pointer}

/* ---- components.css ---- */
.pv-disclosure{margin:0;color:var(--muted);font-size:var(--font-label-size);
  font-weight:var(--font-label-weight);line-height:var(--font-label-line-height)}
.lifecycle-pill{display:inline-flex;align-items:center;padding:0 var(--space-sm);
  border-radius:var(--radius);background:var(--surface2);border:1px solid var(--border);
  color:var(--muted);font-size:var(--font-label-size);font-weight:var(--font-label-weight);
  line-height:var(--font-label-line-height)}
.lifecycle-pill--pre{opacity:.85}
.lifecycle-pill--voting{color:var(--text);opacity:1}
.lifecycle-pill--settling{color:var(--warn);opacity:1}
.lifecycle-pill--closed{opacity:.85}
.lifecycle-pill--indeterminate{color:var(--text);opacity:.85}
.dt-toggle-group{display:flex;flex-direction:column;gap:var(--space-xs)}

/* ---- panels.css ---- */
.panel{display:flex;flex-direction:column;gap:var(--space-sm);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-md)}
.panel--denied{opacity:.5}
.panel-header{display:flex;align-items:center;gap:var(--space-sm)}
.panel-icon{font-size:var(--font-heading-size);line-height:var(--font-heading-line-height)}
.panel-title{margin:0;font-size:var(--font-heading-size);font-weight:var(--font-heading-weight);
  line-height:var(--font-heading-line-height);color:var(--text)}
.panel-pills{display:flex;flex-wrap:wrap;gap:var(--space-xs)}
.pill{display:inline-flex;align-items:center;padding:0 var(--space-sm);border-radius:var(--radius);
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  font-size:var(--font-label-size);font-weight:var(--font-label-weight);line-height:var(--font-label-line-height)}
.panel-body{color:var(--text);font-size:var(--font-body-size);font-weight:var(--font-body-weight);
  line-height:var(--font-body-line-height)}
.panel-empty{margin:0;color:var(--muted)}

/* ---- election-ops.css ---- */
.eo-section{display:flex;flex-direction:column;gap:var(--space-sm);padding-top:var(--space-sm);
  border-top:1px solid var(--border)}
.eo-section:first-child{padding-top:0;border-top:none}
.eo-kv{display:grid;grid-template-columns:auto 1fr;column-gap:var(--space-md);
  row-gap:var(--space-xs);margin:0}
.eo-kv dt{color:var(--muted);font-size:var(--font-label-size);font-weight:var(--font-label-weight);
  line-height:var(--font-label-line-height)}
.eo-kv dd{margin:0;color:var(--text)}
.eo-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-sm);
  padding:var(--space-xs) 0;border-bottom:1px solid var(--border)}
.eo-row:last-child{border-bottom:none}
.eo-count-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--space-sm)}
.eo-count-grid > div{display:flex;flex-direction:column;gap:var(--space-xs);padding:var(--space-sm);
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius)}
.eo-timeline{display:flex;flex-direction:column;gap:var(--space-xs);margin:0;padding:0;list-style:none}
.eo-timeline li{display:flex;justify-content:space-between;gap:var(--space-sm)}
.eo-tl--past{color:var(--muted)}
.eo-tl--future{color:var(--text)}
.eo-tl--current{color:var(--text);font-weight:var(--font-heading-weight);
  background:var(--surface2);padding:0 var(--space-xs)}
.eo-datum{color:var(--muted);font-size:var(--font-label-size);font-weight:var(--font-label-weight);
  line-height:var(--font-label-line-height)}

/* ---- authority-admin.css ---- */
.aa-kv{display:grid;grid-template-columns:auto 1fr;column-gap:var(--space-md);
  row-gap:var(--space-xs);margin:0}
.aa-kv dt{color:var(--muted);font-size:var(--font-label-size);font-weight:var(--font-label-weight);
  line-height:var(--font-label-line-height)}
.aa-kv dd{margin:0;color:var(--text)}
.aa-row{display:flex;flex-direction:column;gap:var(--space-xs);padding:var(--space-xs) 0;
  border-bottom:1px solid var(--border)}
.aa-row:last-child{border-bottom:none}
.aa-scope{display:inline-flex;align-items:center;padding:0 var(--space-sm);border-radius:var(--radius);
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  font-size:var(--font-label-size);font-weight:var(--font-label-weight);
  line-height:var(--font-label-line-height);margin-right:var(--space-xs)}
.aa-scope-list{display:flex;flex-wrap:wrap;gap:var(--space-xs)}
.aa-mono{font-family:ui-monospace,monospace}
.aa-empty{margin:0;color:var(--muted)}
.aa-section{display:flex;flex-direction:column;gap:var(--space-sm);padding-top:var(--space-sm);
  border-top:1px solid var(--border)}
.aa-section:first-child{padding-top:0;border-top:none}
/* ============================================================================
   PROTOTYPE-ONLY OVERRIDES — NOT IN THE REAL CSS.

   Everything above this line is transcribed. Everything below is this file's
   own, added only so the prototype stays legible, and each one is a standing
   note about the real app rather than a fix to copy blindly:

   1. WRAPPING. A 43-char base64url id and a 52-char PeerId contain no break
      opportunity, so in a 340px panel the real rules let them overflow their
      container. The prototype forces a break; the app does not.
   2. PANEL/CARD FLOW. .panel-body and .sh-error-banner are colour-and-font
      rules in the real CSS with no display or gap, so their children stack on
      default block flow and the spacing you see here is invented.

const ROUTE_IDS=ROUTES.filter(r=>r.id).map(r=>r.id);
const BOOTSTRAP_ROUTES=new Set(ROUTE_IDS.filter(id=>id.startsWith('bootstrap')));

function go(id){
  if(!ROUTE_IDS.includes(id)) id='dashboard';
  /* reset to defaults, then apply the route's own deltas */
  S.route=id;
  S.realScopes=ALL_SCOPES.slice(); S.effectiveScopes=ALL_SCOPES.slice();
  S.revealDenied=false; S.switcherOpen=false; S.kebabOpen=false; S.dialog=null;
  S.errorBanner=null; S.stale=false; S.toast=null; S.empty=false;
  S.bootstrapPhase=null; S.bootstrapError=null; S.bootstrapOk=false; S.forgetInput='';
  ROUTES.find(r=>r.id===id).apply();
  if(location.hash.slice(1)!==id) location.hash=id;
  render();
}

function renderRail(){
  document.getElementById('railstates').innerHTML=ROUTES.map(r=>
    r.group ? '<div class="grp">'+esc(r.group)+'</div>'
            : '<button class="r" data-route="'+r.id+'" aria-current="'+(r.id===S.route?'true':'false')+'">'+esc(r.label)+'</button>'
  ).join('');
  document.querySelectorAll('#widths button').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.w===S.width ? 'true':'false'));
}
/* The app renders inside an <iframe> so that shell.css's @media (max-width:900px)
   sees a real viewport. The frame gets ONLY the #app-style sheet — the rail's
   stylesheet stays in this document and cannot reach the app surface. */
const appDoc=()=>document.getElementById('stage').contentDocument;
function bootFrame(){
  const d=appDoc();
  d.open();
  d.write('<!doctype html><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width, initial-scale=1">'
    +document.getElementById('app-style').outerHTML
    +'<div id="root"></div>');   /* #root, because tokens.css sizes html, body AND #root */
  d.close();
  d.addEventListener('click',onAppClick);
  d.addEventListener('input',onAppInput);
}
function render(){
  renderRail();
  const frame=document.getElementById('stage');
  frame.style.maxWidth = S.width==='full' ? 'none' : S.width+'px';
  document.getElementById('stagelabel').textContent =
    '#'+S.route+'   ·   '+(S.width==='full'?'full width':S.width+'px')
    +'   ·   effective scopes: ['+S.effectiveScopes.join(', ')+']';
  appDoc().getElementById('root').innerHTML =
    BOOTSTRAP_ROUTES.has(S.route) ? BootstrapScreen() : DashboardScreen();
}
/* rail + width picker live in THIS document; everything else is in the frame */
document.addEventListener('click',e=>{
  const routeBtn=e.target.closest('#railstates button');
  if(routeBtn){ go(routeBtn.dataset.route); return; }
  const widthBtn=e.target.closest('#widths button');
  if(widthBtn){ S.width=widthBtn.dataset.w; render(); }
});
function onAppClick(e){
  const act=e.target.closest('[data-act]');
  if(!act) return;
  switch(act.dataset.act){
    case 'reveal': S.revealDenied=!S.revealDenied; break;
    case 'switcher': S.switcherOpen=!S.switcherOpen; S.kebabOpen=false; break;
    case 'kebab': S.kebabOpen=!S.kebabOpen; S.switcherOpen=false; break;
    case 'forget': S.kebabOpen=false; S.dialog='forget'; break;
    case 'close-dialog': S.dialog=null; break;
    case 'pv-reset': S.effectiveScopes=S.realScopes.slice(); break;
    case 'pv-toggle': {
      const sc=act.dataset.scope;
      S.effectiveScopes = S.effectiveScopes.includes(sc)
        ? S.effectiveScopes.filter(x=>x!==sc)
        : ALL_SCOPES.filter(x=>S.effectiveScopes.includes(x)||x===sc);
      break;
    }
    default: return;
  }
  render();
}
function onAppInput(e){
  if(e.target.dataset.act==='forget-input'){
    S.forgetInput=e.target.value;
    const btn=appDoc().querySelector('.sh-dialog-cta--destructive');
    if(btn) btn.disabled = S.forgetInput!==NETWORKS[0].authorityName;
  }
}
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h&&h!==S.route) go(h); });

bootFrame();
go(location.hash.slice(1)||'dashboard');
</script>
</body>
</html>
